<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CtrlMap — Cross-framework clarity. | ISO 27001 Cross-Reference Atlas</title>
<meta name="description" content="CtrlMap is a free open-source GRC platform mapping ISO 27001:2022 controls across 11 frameworks including NIST CSF 2.0, SOC 2, CIS v8, PCI DSS, NIS 2, NCSC CAF and more. No backend, no account required.">
<meta property="og:title" content="CtrlMap — Cross-framework clarity.">
<meta property="og:description" content="Cross-reference 11 security frameworks from a single ISO 27001 spine. Track readiness, score controls, and export evidence — all in one self-contained browser tool.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== GRC PLATFORM — clean SaaS, Vanta-spirit ====================== */
  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --surface-2: #F1F3F7;
    --surface-3: #E9EDF2;
    --border: #E4E7EC;
    --border-strong: #D0D5DD;
    --ink: #0B1626;
    --ink-2: #344054;
    --ink-3: #667085;
    --ink-4: #98A2B3;
    --ink-5: #C9CFD8;
    --brand: #0E7C6A;
    --brand-hov: #0A5C50;
    --brand-50: #E6F4F1;
    --brand-100: #C7E6DE;
    --brand-200: #98D2C2;
    --brand-700: #0A5C50;
    --brand-text: #0A4A40;
    --success: #079455;
    --success-50: #ECFDF3;
    --success-100: #D1FADF;
    --success-text: #027A48;
    --warning: #DC6803;
    --warning-50: #FFFAEB;
    --warning-100: #FEF0C7;
    --warning-text: #B54708;
    --error: #D92D20;
    --error-50: #FEF3F2;
    --error-100: #FEE4E2;
    --error-text: #B42318;
    --info: #175CD3;
    --info-50: #EFF8FF;
    --info-100: #D1E9FF;
    --info-text: #1849A9;
    --violet: #6938EF;
    --violet-50: #F4F3FF;
    --violet-text: #5925DC;
    --pink: #DD2590;
    --pink-50: #FDF2FA;
    --pink-text: #C11574;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
    --shadow-md: 0 1px 3px rgba(16, 24, 40, 0.10), 0 1px 2px rgba(16, 24, 40, 0.06);
    --shadow-lg: 0 4px 6px -1px rgba(16, 24, 40, 0.10), 0 2px 4px -2px rgba(16, 24, 40, 0.06);
    --shadow-xl: 0 12px 24px -8px rgba(16, 24, 40, 0.12), 0 4px 8px -4px rgba(16, 24, 40, 0.06);
  }
  [data-theme='dark'] {
    --bg: #0E1117;
    --surface: #161B22;
    --surface-2: #1C2230;
    --surface-3: #232B3A;
    --border: #262E3D;
    --border-strong: #3A4456;
    --ink: #F0F5FA;
    --ink-2: #C8D1DC;
    --ink-3: #8B95A4;
    --ink-4: #6A7382;
    --ink-5: #4A525E;
    --brand: #3DD3B0;
    --brand-hov: #5DDFC2;
    --brand-50: rgba(61, 211, 176, 0.08);
    --brand-100: rgba(61, 211, 176, 0.16);
    --brand-200: rgba(61, 211, 176, 0.30);
    --brand-700: #76E5C8;
    --brand-text: #76E5C8;
    --success: #34D399;
    --success-50: rgba(52, 211, 153, 0.10);
    --success-100: rgba(52, 211, 153, 0.20);
    --success-text: #6EE7B7;
    --warning: #FBBF24;
    --warning-50: rgba(251, 191, 36, 0.10);
    --warning-100: rgba(251, 191, 36, 0.20);
    --warning-text: #FCD34D;
    --error: #F87171;
    --error-50: rgba(248, 113, 113, 0.10);
    --error-100: rgba(248, 113, 113, 0.20);
    --error-text: #FCA5A5;
    --info: #60A5FA;
    --info-50: rgba(96, 165, 250, 0.10);
    --info-100: rgba(96, 165, 250, 0.20);
    --info-text: #93C5FD;
    --violet: #A78BFA;
    --violet-50: rgba(167, 139, 250, 0.10);
    --violet-text: #C4B5FD;
    --pink: #F472B6;
    --pink-50: rgba(244, 114, 182, 0.10);
    --pink-text: #F9A8D4;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.30);
    --shadow-md: 0 1px 3px rgba(0, 0, 0, 0.40), 0 1px 2px rgba(0, 0, 0, 0.20);
    --shadow-lg: 0 4px 6px -1px rgba(0, 0, 0, 0.40), 0 2px 4px -2px rgba(0, 0, 0, 0.20);
    --shadow-xl: 0 12px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.20);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01", "cv11";
  }
  ::selection { background: var(--brand-100); color: var(--brand-text); }

  input, button, textarea, select { font: inherit; color: inherit; }
  input::placeholder { color: var(--ink-4); }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--brand) !important;
    box-shadow: 0 0 0 4px var(--brand-50);
  }
  button { cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-5); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  .anim-fade { animation: fadeIn 0.18s ease-out backwards; }
  .anim-slide-up { animation: slideUp 0.24s cubic-bezier(.2,.8,.2,1) backwards; }
  .anim-slide-down { animation: slideDown 0.16s cubic-bezier(.2,.8,.2,1) backwards; }

  /* ----- Layout ----- */
  .app-shell { min-height: 100vh; display: grid; grid-template-columns: 264px 1fr; background: var(--bg); }
  .app-shell.is-collapsed { grid-template-columns: 64px 1fr; }
  @media (max-width: 900px) { .app-shell, .app-shell.is-collapsed { grid-template-columns: 1fr; } }

  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    height: 100vh;
    position: sticky; top: 0;
    overflow-y: auto;
    transition: width 0.18s cubic-bezier(.2,.8,.2,1);
  }
  @media (max-width: 900px) {
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; z-index: 60; box-shadow: var(--shadow-xl); transform: translateX(0); transition: transform 0.2s cubic-bezier(.2,.8,.2,1); }
    .sidebar.sb-closed { transform: translateX(-100%); }
  }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    height: 64px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px;
  }
  .main-content { padding: 28px 32px 56px; }
  @media (max-width: 720px) { .main-content { padding: 20px 16px 48px; } .topbar { padding: 0 16px; } }

  /* Atoms */
  .pill-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-2);
    font-size: 12.5px; font-weight: 500;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.14s cubic-bezier(.2,.8,.2,1);
    white-space: nowrap;
  }
  .pill-btn:hover { border-color: var(--border-strong); background: var(--surface-2); color: var(--ink); }
  .pill-btn.is-active { background: var(--brand-50); border-color: var(--brand-200); color: var(--brand-text); font-weight: 600; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px;
    font-family: 'Hanken Grotesk', sans-serif;
    font-size: 11.5px; font-weight: 500;
    border-radius: 6px;
    border: 1px solid;
    line-height: 1.4;
  }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .badge.b-success { background: var(--success-50); color: var(--success-text); border-color: var(--success-100); }
  .badge.b-warning { background: var(--warning-50); color: var(--warning-text); border-color: var(--warning-100); }
  .badge.b-error   { background: var(--error-50);   color: var(--error-text);   border-color: var(--error-100); }
  .badge.b-info    { background: var(--info-50);    color: var(--info-text);    border-color: var(--info-100); }
  .badge.b-violet  { background: var(--violet-50);  color: var(--violet-text);  border-color: rgba(105,56,239,0.12); }
  .badge.b-pink    { background: var(--pink-50);    color: var(--pink-text);    border-color: rgba(221,37,144,0.12); }
  .badge.b-brand   { background: var(--brand-50);   color: var(--brand-text);   border-color: var(--brand-100); }
  .badge.b-neutral { background: var(--surface-2);  color: var(--ink-2);        border-color: var(--border); }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    font-size: 13.5px; font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.14s cubic-bezier(.2,.8,.2,1);
    box-shadow: var(--shadow-sm);
  }
  .btn:hover { background: var(--surface-2); border-color: var(--ink-4); }
  .btn.btn-primary { background: var(--brand); color: #FFFFFF; border-color: var(--brand); }
  .btn.btn-primary:hover { background: var(--brand-hov); border-color: var(--brand-hov); }
  .btn.btn-ghost { border-color: transparent; background: transparent; box-shadow: none; }
  .btn.btn-ghost:hover { background: var(--surface-2); }
  .btn.btn-icon { padding: 8px; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13.5px; font-weight: 500;
    color: var(--ink-2);
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
    border: 1px solid transparent;
    background: transparent;
    width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item.is-active { background: var(--brand-50); color: var(--brand-text); font-weight: 600; border-color: var(--brand-100); }
  .nav-item .nav-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: 0.75; flex-shrink: 0; }
  .nav-item .nav-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .nav-item.is-active .nav-count { color: var(--brand-text); }

  .nav-section-title {
    text-transform: uppercase;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    padding: 14px 12px 6px;
  }

  .control-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: border-color 0.12s, box-shadow 0.12s, transform 0.12s;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
  }
  .control-card:hover { border-color: var(--ink-5); box-shadow: var(--shadow-md); }
  .control-card.is-open { border-color: var(--brand-200); box-shadow: 0 0 0 3px var(--brand-50), var(--shadow-md); }

  .input {
    width: 100%;
    padding: 10px 14px 10px 40px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    font-size: 14px;
    border-radius: 8px;
    transition: border-color 0.12s, box-shadow 0.12s;
    box-shadow: var(--shadow-sm);
  }
  .input-wrap { position: relative; flex: 1; }
  .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-4); pointer-events: none; font-size: 16px; display: inline-flex; align-items: center; }

  .fw-tabs {
    display: flex; gap: 6px;
    padding: 4px;
    background: var(--surface-2);
    border-radius: 10px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .fw-tabs::-webkit-scrollbar { display: none; }
  .fw-tab {
    padding: 7px 12px;
    border: 0;
    background: transparent;
    color: var(--ink-3);
    font-size: 13px; font-weight: 500;
    border-radius: 7px;
    white-space: nowrap;
    transition: all 0.14s cubic-bezier(.2,.8,.2,1);
    cursor: pointer; flex-shrink: 0;
  }
  .fw-tab:hover { color: var(--ink); background: var(--surface); }
  .fw-tab.is-active { background: var(--surface); color: var(--brand-text); box-shadow: var(--shadow-sm); font-weight: 600; }

  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.12s, box-shadow 0.12s, transform 0.12s;
    flex: 1; min-width: 130px;
    position: relative;
  }
  .stat-tile:hover { border-color: var(--ink-5); box-shadow: var(--shadow-sm); }
  .stat-tile.is-active { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-50); }
  .stat-tile .stat-num { font-size: 26px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
  .stat-tile .stat-label { margin-top: 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-tile .stat-bar { position: absolute; top: 14px; right: 16px; width: 6px; height: 24px; border-radius: 3px; }

  .progress-track {
    height: 8px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
    display: flex;
  }
  .progress-fill { height: 100%; transition: width 0.4s cubic-bezier(.2,.8,.2,1); }

  .section-hdr-v2 { display: flex; align-items: center; gap: 10px; margin: 28px 0 12px; padding: 8px 0; }
  .section-hdr-v2 .sec-name { font-size: 16px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
  .section-hdr-v2 .sec-meta { color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }

  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(11, 22, 38, 0.50);
    backdrop-filter: blur(4px);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    animation: fadeIn 0.18s ease-out;
  }
  .modal-card {
    max-width: 540px; width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow-xl);
    overflow: hidden;
    animation: scaleIn 0.18s cubic-bezier(.2,.8,.2,1);
  }

  .ac-pop {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow-lg);
    z-index: 100;
    max-height: 320px; overflow-y: auto;
    padding: 6px;
    animation: slideDown 0.14s cubic-bezier(.2,.8,.2,1);
  }
  .ac-row { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ac-row:hover, .ac-row.is-hover { background: var(--surface-2); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    padding: 10px 16px;
    background: var(--ink);
    color: #FFFFFF;
    font-size: 13px; font-weight: 500;
    border-radius: 8px;
    box-shadow: var(--shadow-xl);
    z-index: 200;
    display: flex; align-items: center; gap: 8px;
    animation: slideUp 0.2s cubic-bezier(.2,.8,.2,1);
  }
  [data-theme='dark'] .toast { background: var(--surface-3); color: var(--ink); border: 1px solid var(--border); }

  .score-grp {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
  }
  .score-btn {
    padding: 6px 12px;
    border: 0; background: transparent;
    color: var(--ink-3);
    font-size: 12.5px; font-weight: 500;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    border-right: 1px solid var(--border);
    transition: background 0.12s;
  }
  .score-btn:last-child { border-right: 0; }
  .score-btn:hover { background: var(--surface-2); }
  .score-btn.is-active.s-success  { background: var(--success-50); color: var(--success-text); font-weight: 600; }
  .score-btn.is-active.s-warning  { background: var(--warning-50); color: var(--warning-text); font-weight: 600; }
  .score-btn.is-active.s-error    { background: var(--error-50);   color: var(--error-text);   font-weight: 600; }
  .score-btn.is-active.s-neutral  { background: var(--surface-3);  color: var(--ink-3);        font-weight: 600; }

  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .label-up { text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; font-weight: 700; color: var(--ink-3); }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .breadcrumb { font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .breadcrumb .bc-sep { color: var(--ink-4); }
  .breadcrumb .bc-current { color: var(--ink); font-weight: 600; }

  .mob-open-btn { display: none; }
  @media (max-width: 900px) { .mob-open-btn { display: inline-flex; } }

  .mob-backdrop { display: none; position: fixed; inset: 0; background: rgba(11, 22, 38, 0.40); z-index: 55; }
  @media (max-width: 900px) { .mob-backdrop.is-shown { display: block; } }

  /* ===== HOME PAGE ==================================================== */
  .home-page { max-width: 1080px; margin: 0 auto; padding: 0 0 80px; animation: home-in 0.4s ease both; }
  @keyframes home-in { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

  /* Hero — two-column */
  .home-hero { display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center; padding:48px 24px 56px; }
  @media(max-width:820px){ .home-hero{grid-template-columns:1fr;} .home-hero-preview{display:none;} }
  .home-eyebrow { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .home-eyebrow-line { height:1px; width:32px; background:var(--brand); flex-shrink:0; }
  .home-eyebrow-text { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--brand); letter-spacing:0.1em; text-transform:uppercase; font-weight:600; }
  .home-hero h1 { font-size:clamp(34px,5vw,54px); font-weight:800; letter-spacing:-0.035em; line-height:1.05; color:var(--ink); margin:0 0 20px; }
  .home-grad { background:linear-gradient(135deg,var(--brand) 0%,var(--info) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .home-hero-sub { font-size:15.5px; color:var(--ink-3); line-height:1.65; max-width:480px; margin-bottom:32px; }
  .home-actions { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:40px; }
  .home-cta { display:inline-flex; align-items:center; gap:8px; background:var(--brand); color:#fff; border:none; border-radius:9px; padding:12px 26px; font-size:14.5px; font-weight:700; cursor:pointer; letter-spacing:-0.01em; transition:background 0.15s,transform 0.12s,box-shadow 0.15s; box-shadow:0 1px 3px rgba(14,124,106,0.3),0 4px 14px rgba(14,124,106,0.18); font-family:inherit; }
  .home-cta:hover { background:var(--brand-hov); transform:translateY(-2px); box-shadow:0 2px 8px rgba(14,124,106,0.3),0 8px 24px rgba(14,124,106,0.2); }
  .home-cta-arrow { font-size:16px; transition:transform 0.15s; }
  .home-cta:hover .home-cta-arrow { transform:translateX(3px); }
  .home-cta-ghost { display:inline-flex; align-items:center; gap:8px; border:1.5px solid var(--border); background:transparent; color:var(--ink-2); border-radius:9px; padding:11px 20px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:all 0.15s; }
  .home-cta-ghost:hover { border-color:var(--brand); color:var(--brand); background:var(--brand-50); }
  .home-stat-row { display:flex; gap:32px; padding-top:32px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .home-stat-num { font-size:28px; font-weight:800; letter-spacing:-0.04em; color:var(--brand); font-family:'JetBrains Mono',monospace; line-height:1; }
  .home-stat-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-4); margin-top:4px; }

  /* Compliance preview card */

  .map-disclaimer {

          ]
        }
      ]
    }
  ]
};

        {id:"CIS 1.2", name:"Address Unauthorised Assets", desc:"[IG1] Ensure that a process exists to address unauthorised assets on a weekly basis. The enterprise may choose to remove the asset from the network, deny the asset from connecting remotely to the network, or quarantine the asset.", achieved:["Documented process for handling unauthorised assets exists and is followed.","Evidence of unauthorised devices being quarantined or removed."], evidence:["Incident or change tickets for unauthorised device handling","NAC quarantine logs"]},
        {id:"CIS 1.3", name:"Utilise an Active Discovery Tool", desc:"[IG2] Utilise an active discovery tool to identify assets connected to the enterprise's network. Configure the active discovery tool to execute daily, or more frequently.", achieved:["Active scanning tool is deployed and runs on a defined schedule.","Scan results are reviewed and fed into the asset inventory."], evidence:["Discovery tool configuration showing scan schedule","Scan output reports"]},

        {id:"CIS 2.2", name:"Ensure Authorised Software is Currently Supported", desc:"[IG1] Ensure that only currently supported software is designated as authorised in the software inventory. Unsupported software should be tagged as unsupported and reviewed monthly.", achieved:["All authorised software has an active support/maintenance status.","EOL software is identified and remediation-tracked."], evidence:["EOL software report from SAM or patch management tool"]},
        {id:"CIS 2.3", name:"Address Unauthorised Software", desc:"[IG1] Ensure that unauthorised software is either removed, quarantined, or the exception is documented with business justification.", achieved:["Process for handling unauthorised software is defined and followed.","Evidence of removal or exception approval for all detected unauthorised software."], evidence:["Tickets or change records for unauthorised software removal","Exception register"]},

      evidence:[

      items:[
        {id:"CIS 3.1", name:"Establish and Maintain a Data Management Process", desc:"[IG1] Establish and maintain a data management process. In the process, address data sensitivity, data owner, handling of data, data retention limits, and disposal requirements, based on sensitivity and retention standards for the enterprise.", achieved:["Data management process is documented, approved, and communicated.","Data owners are assigned for all sensitive data types."], evidence:["Data management policy document","Data owner assignment register"]},
        {id:"CIS 3.2", name:"Establish and Maintain a Data Inventory", desc:"[IG1] Establish and maintain a data inventory based on the enterprise's data management process. Inventory sensitive data at a minimum. Review and update inventory annually, at a minimum, with a priority on sensitive data.", achieved:["Data inventory covers all sensitive data stores with classification, location, and owner.","Inventory reviewed at least annually."], evidence:["Data inventory register or data map"]},
        {id:"CIS 3.3", name:"Configure Data Access Control Lists", desc:"[IG1] Configure data access control lists based on a user's need to know. Apply data access control lists, also known as access permissions, to local and remote file systems, databases, and applications.", achieved:["Access to sensitive data is restricted to those with documented business need.","Access control lists are reviewed at least quarterly."], evidence:["Access control configuration screenshots or exports","Access review reports"]},
        {id:"CIS 3.4", name:"Enforce Data Retention", desc:"[IG1] Retain data according to the enterprise's data management process. Data retention must include both minimum and maximum timeframes.", achieved:["Automated retention policies are configured in document management and email systems.","Retention schedules are aligned with legal and regulatory requirements."], evidence:["Retention policy configuration in DMS or email platform","Retention schedule document"]},
        {id:"CIS 3.5", name:"Securely Dispose of Data", desc:"[IG1] Securely dispose of data as outlined in the enterprise's data management process. Ensure the disposal process and method are commensurate with the data sensitivity.", achieved:["Secure disposal procedures are in place for all media types.","Certificates of destruction are retained for sensitive data disposal."], evidence:["Certificates of destruction from approved disposal provider","Data disposal log"]},
        {id:"CIS 3.6", name:"Encrypt Data on End-User Devices", desc:"[IG1] Encrypt data on end-user devices containing sensitive data. Example implementations include BitLocker for Windows, FileVault for macOS, and full-disk encryption on mobile devices.", achieved:["Full-disk encryption is enforced on all managed end-user devices.","Encryption status is monitored and non-compliant devices are remediated."], evidence:["MDM/endpoint management encryption compliance report"]},
        {id:"CIS 3.7", name:"Establish and Maintain a Data Classification Scheme", desc:"[IG2] Establish and maintain an overall data classification scheme for the enterprise. Enterprises may use labels such as 'Sensitive', 'Confidential', and 'Public' and classify data according to those labels.", achieved:["Classification scheme is documented with clear criteria for each level.","Staff are trained on how to classify data correctly."], evidence:["Data classification policy","Training completion records"]},
        {id:"CIS 3.8", name:"Document Data Flows", desc:"[IG2] Document data flows. Data flow documentation includes service provider data flows and should be based on the enterprise's data management process.", achieved:["Data flow diagrams cover all sensitive data movement including to/from third parties.","Data flows are reviewed when systems change."], evidence:["Data flow diagrams","Third-party data transfer agreements"]},
        {id:"CIS 3.9", name:"Encrypt Data on Removable Media", desc:"[IG2] Encrypt data on removable media.", achieved:["All removable media containing sensitive data is encrypted using approved algorithms.","Port control prevents use of unapproved removable media."], evidence:["Removable media encryption policy","Port control configuration"]},
        {id:"CIS 3.10", name:"Encrypt Sensitive Data in Transit", desc:"[IG2] Encrypt sensitive data in transit. Example implementations include Transport Layer Security (TLS) and Open Secure Shell (OpenSSH).", achieved:["TLS 1.2 or higher is enforced for all data in transit.","Unencrypted protocols are blocked for sensitive data paths."], evidence:["TLS configuration reports","Network policy documentation blocking cleartext protocols"]},
        {id:"CIS 3.11", name:"Encrypt Sensitive Data at Rest", desc:"[IG2] Encrypt sensitive data at rest on servers, applications, and databases containing sensitive data.", achieved:["Database and application-level encryption is enabled for all sensitive data stores.","Encryption keys are managed using a key management service."], evidence:["Database encryption configuration","KMS key policy documentation"]},
        {id:"CIS 3.12", name:"Segment Data Processing and Storage Based on Sensitivity", desc:"[IG2] Segment data processing and storage based on the sensitivity of the data. Do not process sensitive data on enterprise assets intended for lower sensitivity data.", achieved:["High-sensitivity data is processed only on designated, hardened systems.","Network segmentation separates sensitive data processing zones."], evidence:["Network architecture diagram showing segmentation","System classification inventory"]},
        {id:"CIS 3.13", name:"Deploy a Data Loss Prevention Solution", desc:"[IG2] Implement an automated tool, such as a DLP solution, to identify all sensitive data stored, processed, or transmitted through enterprise assets, including those located on-site or at a remote service provider, and update the enterprise's data inventory.", achieved:["DLP solution is deployed covering endpoints, email, and cloud channels.","DLP incidents are reviewed and acted upon within defined SLAs."], evidence:["DLP tool configuration and coverage report","DLP incident response log"]},
        {id:"CIS 3.14", name:"Log Sensitive Data Access", desc:"[IG3] Log sensitive data access, including modification and disposal. Example implementations include logging access to all sensitive data stored in structured data repositories such as databases or data warehouses.", achieved:["Audit logging is enabled for all access to sensitive data stores.","Logs are centralised, protected, and reviewed for anomalies."], evidence:["Database audit log configuration","SIEM alert rules for sensitive data access"]}

        {id:"CIS 4.2", name:"Establish and Maintain a Secure Configuration Process for Network Infrastructure", desc:"[IG1] Establish and maintain a secure configuration process for network devices. Review and update documentation annually.", achieved:["Network device baselines are defined and applied at provisioning.","Baseline compliance is verified during change management."], evidence:["Network device hardening baseline document","Network device configuration audit report"]},
        {id:"CIS 4.3", name:"Configure Automatic Session Locking on Enterprise Assets", desc:"[IG1] Configure automatic session locking on enterprise assets after a defined period of inactivity. For general purpose operating systems, the period must not exceed 15 minutes. For mobile end-user devices, the period must not exceed 2 minutes.", achieved:["Screen lock timeout is enforced via GPO or MDM on all managed devices.","Mobile devices lock after no more than 2 minutes of inactivity."], evidence:["GPO/MDM screen lock policy configuration"]},

        {id:"CIS 4.5", name:"Implement and Manage a Firewall on End-User Devices", desc:"[IG1] Implement and manage a host-based firewall on end-user devices, with a default-deny rule that drops all traffic except those services and ports that are explicitly allowed.", achieved:["Host-based firewall is enforced on all end-user devices via MDM or GPO.","Default-deny inbound policy is applied."], evidence:["MDM/GPO firewall policy configuration report"]},
        {id:"CIS 4.6", name:"Securely Manage Enterprise Assets and Software", desc:"[IG2] Securely manage enterprise assets and software. Manage the security configuration of enterprise assets and software using an enterprise patch management system, configuration manager, or equivalent.", achieved:["Enterprise management tooling (e.g. SCCM, Intune, Ansible) deploys and enforces configurations.","Configuration drift is detected and remediated within defined SLA."], evidence:["Endpoint/configuration management tool coverage report","Drift remediation ticket samples"]},
        {id:"CIS 4.7", name:"Manage Default Accounts on Enterprise Assets and Software", desc:"[IG1] Manage default accounts on enterprise assets and software. Example implementations include disabling default accounts, or making them unusable.", achieved:["All default accounts are disabled, renamed, or their passwords changed before deployment.","No default credentials remain active on production assets."], evidence:["Hardening checklist showing default account remediation","Privileged account audit report"]},
        {id:"CIS 4.8", name:"Uninstall or Disable Unnecessary Services on Enterprise Assets and Software", desc:"[IG2] Uninstall or disable unnecessary services on enterprise assets and software, such as an unused file sharing service, web application module, or service function.", achieved:["Only required services are enabled; all others are disabled.","Service inventory is reviewed when configurations change."], evidence:["Hardening baseline showing disabled services","Vulnerability scan report confirming no unnecessary services"]},
        {id:"CIS 4.9", name:"Configure Trusted DNS Servers on Enterprise Assets", desc:"[IG2] Configure trusted DNS servers on enterprise assets. Example implementations include configuring assets to use enterprise-controlled DNS servers and/or reputable externally accessible DNS servers.", achieved:["All assets use enterprise-approved DNS servers.","Rogue DNS configuration is detected via monitoring."], evidence:["DNS configuration policy","DHCP/DNS server configuration export"]},

        {id:"CIS 5.2", name:"Use Unique Passwords", desc:"[IG1] Use unique passwords for all enterprise assets. Best practice implementation includes, at minimum, an 8-character password for accounts using MFA, and a 14-character password for accounts not using MFA.", achieved:["Password policy enforces minimum length and complexity.","Shared or generic passwords are prohibited and enforced."], evidence:["Password policy configuration (AD/IdP settings)","Evidence of no shared accounts"]},
        {id:"CIS 5.3", name:"Disable Dormant Accounts", desc:"[IG1] Delete or disable any dormant accounts after a period of 45 days of inactivity, where supported.", achieved:["Dormant accounts are disabled within 45 days via automated policy or manual review.","Disabled accounts are reviewed before re-enablement."], evidence:["Dormant account policy","Account management tool report showing last login dates and disable dates"]},
        {id:"CIS 5.4", name:"Restrict Administrator Privileges to Dedicated Administrator Accounts", desc:"[IG1] Restrict administrator privileges to dedicated administrator accounts on enterprise assets. Conduct general computing activities, such as internet browsing, email, and productivity suite use, from the user's primary, non-privileged account.", achieved:["Administrators use separate privileged and standard accounts.","Privileged accounts are not used for day-to-day activities."], evidence:["Privileged account register","Evidence of separate user accounts for admins"]},
