/* Build parent-level column map for hierarchy-aware exports.
   Returns {cols:[string], map:{id:[string]}} where cols are header names
   and map[itemId] gives the parent values to prepend to each row. */
function buildParentMap(fw){
  var hier=fw.hier;
  if(!hier)return{cols:[],map:{}};
  var cols=[],map={};
  /* NCSC CAF: objectives \u2192 principles \u2192 outcomes */
  if(hier.objectives){
    cols=["Objective","Principle"];
    hier.objectives.forEach(function(obj){
      (obj.principles||[]).forEach(function(pr){
        (pr.outcomes||[]).forEach(function(o){
          map[o.id]=[obj.id+" \u2014 "+obj.name,pr.id+" \u2014 "+pr.name];
        });
      });
    });
    return{cols:cols,map:map};
  }
  if(!hier.groups)return{cols:[],map:{}};
  var hasSections=hier.groups.some(function(g){return(g.sections||[]).length>0;});
  var hasItems=!hasSections&&hier.groups.some(function(g){return(g.items||[]).length>0;});
  if(hasSections){
    /* 3-level: groups \u2192 sections \u2192 items (NIST CSF 2.0, SOC 2) */
    var gLbl=fw.id==="SOC 2"?"Trust Services Category":"Function";
    var sLbl=fw.id==="SOC 2"?"Criteria Group":"Category";
    cols=[gLbl,sLbl];
    hier.groups.forEach(function(g){
      (g.sections||[]).forEach(function(s){
        (s.items||[]).forEach(function(it){map[it.id]=[g.id+" \u2014 "+g.name,s.id+" \u2014 "+s.name];});
      });
      (g.items||[]).forEach(function(it){map[it.id]=[g.id+" \u2014 "+g.name,""];});
    });
  } else if(hasItems){
    /* 2-level: groups \u2192 items (CIS v8, Cyber Essentials) */
    if(fw.id==="CIS v8"){
      cols=["Control Group","Impl. Group"];
      hier.groups.forEach(function(g){
        (g.items||[]).forEach(function(it){
          var m=(it.desc||"").match(/^\[IG([123])\]/);
          map[it.id]=[g.id+" \u2014 "+g.name,m?"IG"+m[1]:""];
        });
      });
    } else {
      cols=["Theme"];
      hier.groups.forEach(function(g){
        (g.items||[]).forEach(function(it){map[it.id]=[g.id+" \u2014 "+g.name];});
      });
    }
  } else if(fw.id==="PCI DSS"&&hier.about&&hier.about.sections){
    /* PCI DSS: flat requirements, goals from about.sections descriptions */
    cols=["Goal"];
    var rToG={};
    hier.about.sections.forEach(function(sec){
      ((sec.desc||"").match(/\d+/g)||[]).forEach(function(n){rToG["Req "+n]=sec.name;});
    });
    hier.groups.forEach(function(g){map[g.id]=[rToG[g.id]||""];});
  }
  /* else: flat (NIST 800-53, NIS 2, ISO 22301, ISO 27017) \u2014 no parent cols */
  return{cols:cols,map:map};
}

/* Export for non-ISO framework views \u2014 one row per framework reference, with union of cross-mappings */
function buildHierItemLookup(hier){
  var m={};
  if(!hier)return m;
  /* Standard groups/sections/items structure (NIST CSF, SOC 2, CIS, PCI, CE, NIST 800-53, NIS 2, ISO 22301, ISO 27017) */
  if(hier.groups){
    hier.groups.forEach(function(g){
      m[g.id]={achieved:g.achieved||[],evidence:g.evidence||[]};
      (g.sections||[]).forEach(function(s){
        m[s.id]={achieved:s.achieved||[],evidence:s.evidence||[]};
        (s.items||[]).forEach(function(it){m[it.id]={achieved:it.achieved||[],evidence:it.evidence||[]};});
      });
      (g.items||[]).forEach(function(it){m[it.id]={achieved:it.achieved||[],evidence:it.evidence||[]};});
    });
  }
  /* NCSC CAF structure: objectives → principles → outcomes */
  if(hier.objectives){
    hier.objectives.forEach(function(obj){
      (obj.principles||[]).forEach(function(pr){
        m[pr.id]={achieved:pr.achieved||[],evidence:pr.evidence||[]};
        (pr.outcomes||[]).forEach(function(o){
          m[o.id]={achieved:o.achieved||[],evidence:o.evidence||[]};
        });
      });
    });
  }
  return m;
}
function unionRefs(controls,field){
  var seen={},out=[];
  controls.forEach(function(c){splitRefs(c[field]||"").forEach(function(r){if(!seen[r]){seen[r]=true;out.push(r);}});});
  return out.length?out.join(", "):"N/A";
}
function toFwCSV(derivedList,fw,fwScores){
  var s=fwScores||{},fwId=fw.id;
  var hierL=buildHierItemLookup(fw.hier||{});
  var pm=buildParentMap(fw);
  var xCols=CROSS_FW_COLS.filter(function(c){return c.label!==fwId;});
  var header=pm.cols
    .concat([fwId+" Reference",fwId+" Description","ISO 27001 Mappings"])
    .concat(xCols.map(function(c){return c.label;}))
    .concat(["Implementation Guidance","Typical Evidence to Collect","Assessor Notes",fwId+" Readiness"]);
  var rows=derivedList.map(function(item){
    var cc=item.controls||[];
    var hi=hierL[item.id]||{};
    var guidance=(hi.achieved||[]).map(function(x){return"• "+x;}).join(" | ");
    var evTypes=(hi.evidence||[]).map(function(x){return"• "+x;}).join(" | ");
    var pVals=pm.map[item.id]||pm.cols.map(function(){return"";});
    return pVals
      .concat([item.id,item.desc||"",cc.map(function(c){return c.id}).join(", ")])
      .concat(xCols.map(function(c){return unionRefs(cc,c.prop);}))
      .concat([guidance,evTypes,"",SCORE_LABEL[s[item.id]||"unimplemented"]])
      .map(escapeCSV).join(",");
  });
  return"\uFEFF"+[header.map(escapeCSV).join(",")].concat(rows).join("\r\n");
}
function fwExportFilename(fw,ext){
  return"ctrlmap-"+fw.id.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-export."+ext;
}

/* Precompute total scoreable items per framework (used for home-page donut charts) */
var FW_TOTALS=(function(){
  var t={"ISO 27001":CONTROLS.length};
  FRAMEWORKS.forEach(function(fw){
    if(fw.id==="ISO 27001")return;
    var seen={};
    CONTROLS.forEach(function(c){splitRefs(c[fw.prop]||"").forEach(function(r){seen[r]=true;});});
    t[fw.id]=Object.keys(seen).length;
  });
  return t;
})();

/* Mini SVG donut chart — rendered on home page framework cards */
function DonutChart(p){
  var impl=p.impl||0,prog=p.prog||0,total=p.total||0;
  if(total===0)return null;
  var R=12,sw=3.5,sz=32,circ=2*Math.PI*R;
  var implLen=(impl/total)*circ;
  var progLen=(prog/total)*circ;
  var progRotate=-90+(impl/total)*360;
  var pct=Math.round(((impl+prog*0.5)/total)*100);
  var hasAny=impl+prog>0;
  return e("svg",{width:sz,height:sz,viewBox:"0 0 32 32",
    onClick:function(ev){ev.stopPropagation()},
    style:{flexShrink:0,display:"block"}},
    e("circle",{cx:16,cy:16,r:R,fill:"none",stroke:"var(--border)",strokeWidth:sw}),
    impl>0&&e("circle",{cx:16,cy:16,r:R,fill:"none",stroke:"var(--success)",
      strokeWidth:sw,strokeDasharray:implLen+" "+(circ-implLen),
      transform:"rotate(-90 16 16)",style:{transition:"stroke-dasharray 0.5s ease"}}),
    prog>0&&e("circle",{cx:16,cy:16,r:R,fill:"none",stroke:"var(--warning)",
      strokeWidth:sw,strokeDasharray:progLen+" "+(circ-progLen),
      transform:"rotate("+progRotate+" 16 16)",style:{transition:"stroke-dasharray 0.5s ease"}}),
    hasAny&&e("text",{x:16,y:20,textAnchor:"middle",fontSize:7.5,fontWeight:700,
      fill:"var(--ink-3)",fontFamily:"'JetBrains Mono',monospace"},pct+"%")
  );
}

                  "Cross-framework links on this view are computed transitively through shared ISO 27001:2022 anchors. They are useful for triage, not certified equivalence. Confirm against official framework mappings before audit or certification use."
                )
              ),
              /* Progress */
              e(ProgressBar,{items:primaryFw==="ISO 27001"?filteredIsos:derivedList,scores:primaryFw==="ISO 27001"?isoScores:fwScores,primaryFw:primaryFw}),
              /* Search */
              e("div",{style:{display:"flex",gap:8,alignItems:"flex-start"}},
                e("div",{style:{flex:1}},e(SearchBox,{search:search,setSearch:setSearch,onSearchClick:function(t){setSearch(t)}})),
                e("button",{
                  onClick:function(){setGlobalMode(!globalMode);},
                  title:globalMode?"Back to current framework view":"Search across all frameworks",
                  className:"btn"+(globalMode?" btn-primary":""),
                  style:{flexShrink:0,fontSize:12.5,fontWeight:600,gap:5,display:"flex",alignItems:"center",whiteSpace:"nowrap",marginTop:0}
                },
                  e("span",{style:{fontSize:14,lineHeight:1}},"⊕"),
                  globalMode?"All frameworks":"All frameworks"
                )
              ),
              /* Stats */
              primaryFw==="CIS v8"&&e(React.Fragment,null,
                e("div",{style:{display:"grid",gridTemplateColumns:"repeat(2, 1fr)",gap:10,marginBottom:6,marginTop:10}},
                  e("div",{className:"stat-tile",style:{cursor:"default"}},
                    e("span",{className:"stat-bar",style:{background:"#10B981"}}),
                    e("div",{className:"stat-num"},"18"),
                    e("div",{className:"stat-label"},"Controls")
                  ),
                  e("div",{className:"stat-tile",style:{cursor:"default"}},
                    e("span",{className:"stat-bar",style:{background:"#10B981"}}),
                    e("div",{className:"stat-num"},derivedList.length+(derivedList.length<153?" (filtered)":"")),
                    e("div",{className:"stat-label"},"Safeguards")
                  )
                ),
                e("div",{style:{display:"grid",gridTemplateColumns:"repeat(3, 1fr)",gap:10,marginBottom:8}},
                  e("div",{className:"stat-tile",style:{cursor:"default"}},
                    e("span",{className:"stat-bar",style:{background:"#10B981",opacity:0.5}}),
                    e("div",{className:"stat-num",style:{fontSize:18}},"56"),
                    e("div",{className:"stat-label"},"IG1 — Essential")
                  ),
                  e("div",{className:"stat-tile",style:{cursor:"default"}},
                    e("span",{className:"stat-bar",style:{background:"#10B981",opacity:0.7}}),
                    e("div",{className:"stat-num",style:{fontSize:18}},"131"),
                    e("div",{className:"stat-label"},"IG2 — Cumulative")
                  ),
                  e("div",{className:"stat-tile",style:{cursor:"default"}},
                    e("span",{className:"stat-bar",style:{background:"#10B981"}}),
                    e("div",{className:"stat-num",style:{fontSize:18}},"153"),
                    e("div",{className:"stat-label"},"IG3 — All")
                  )
                )
              ),
              primaryFw==="NCSC CAF"&&e("div",{style:{display:"grid",gridTemplateColumns:"repeat(3, 1fr)",gap:10,marginBottom:8,marginTop:10}},
                e("div",{className:"stat-tile",style:{cursor:"default"}},
                  e("span",{className:"stat-bar",style:{background:"#1E40AF"}}),
                  e("div",{className:"stat-num"},"4"),
                  e("div",{className:"stat-label"},"Objectives")
                ),
                e("div",{className:"stat-tile",style:{cursor:"default"}},
                  e("span",{className:"stat-bar",style:{background:"#1E40AF"}}),
                  e("div",{className:"stat-num"},"14"),
                  e("div",{className:"stat-label"},"Principles")
                ),
                e("div",{className:"stat-tile",style:{cursor:"default"}},
                  e("span",{className:"stat-bar",style:{background:"#1E40AF"}}),
                  e("div",{className:"stat-num"},derivedList.length+(derivedList.length<41?" (filtered)":"")),
                  e("div",{className:"stat-label"},"Contributing Outcomes")
                )
              ),
              primaryFw==="PCI DSS"&&e("div",{style:{display:"grid",gridTemplateColumns:"repeat(3, 1fr)",gap:10,marginBottom:8,marginTop:10}},
                e("div",{className:"stat-tile",style:{cursor:"default"}},
                  e("span",{className:"stat-bar",style:{background:"#F59E0B"}}),
                  e("div",{className:"stat-num"},"6"),
                  e("div",{className:"stat-label"},"Goals")
                ),
                e("div",{className:"stat-tile",style:{cursor:"default"}},
                  e("span",{className:"stat-bar",style:{background:"#F59E0B"}}),
                  e("div",{className:"stat-num"},"12"),
                  e("div",{className:"stat-label"},"Requirements")
                ),
                e("div",{className:"stat-tile",style:{cursor:"default"}},
                  e("span",{className:"stat-bar",style:{background:"#F59E0B"}}),
                  e("div",{className:"stat-num"},derivedList.length+(derivedList.length<12?" (filtered)":"")),
                  e("div",{className:"stat-label"},"Shown")
                )
              ),
              stats.funcs.length>0&&e("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(140px, 1fr))",gap:10,marginBottom:8,marginTop:10}},
                stats.funcs.filter(function(f){return f.count>0}).map(function(f){
                  var isActive=funcF===f.name;
                  return e("div",{key:f.name,onClick:function(){setFuncF(funcF===f.name?"All":f.name)},title:"Filter by "+f.name,className:"stat-tile"+(isActive?" is-active":"")},
                    e("span",{className:"stat-bar",style:{background:FC[f.name]}}),
                    e("div",{className:"stat-num"},f.count),
                    e("div",{className:"stat-label"},f.name)
                  );
                }),
                e("div",{className:"stat-tile",style:{cursor:"default"}},
                  e("span",{className:"stat-bar",style:{background:"var(--brand)"}}),
                  e("div",{className:"stat-num"},stats.total),
                  e("div",{className:"stat-label"},"Total")
                )
              ),
              /* Cards */
              globalMode
                ? e("div",{style:{marginTop:18}},e(GlobalSearchResults,{
                    query:search,
                    onNavigate:function(fwId,controlId){
                      setPrimaryFw(fwId);
                      setExp(controlId);
                      setGlobalMode(false);
                    }
                  }))
                : e("div",{style:{marginTop:18}},cardEls),
              /* Footer */
              e("div",{style:{marginTop:48,paddingTop:20,borderTop:"1px solid var(--border)",textAlign:"center"}},
                e("div",{style:{fontSize:12,color:"var(--ink-4)",lineHeight:1.6}},"ISO 27001:2022 · NIST CSF 2.0 · SOC 2 · CIS v8 · PCI DSS 4.0 · Cyber Essentials · NIST 800-53 · NIS 2 · ISO 22301 · ISO 27017 · NCSC CAF")
              )
            )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
