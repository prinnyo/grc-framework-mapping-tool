{id:"A.5.26",isoDesc:"Information security incidents should be responded to in accordance with the documented procedures.",name:"Response to information security incidents",cat:"Organizational",nistFunc:"RESPOND",nistCat:"RS.MA",nistSub:"RS.MA-02, RS.MA-03, RS.AN-03, RS.MI-01, RS.MI-02",soc2:"CC7.4",cis:"CIS 17",pci:"Req 12",ce:"N/A",n80053:"IR",nis2:"Art.21(b)",iso22301:"Cl.8.4",iso27017:"§16, CLD.16.1.3",notes:"Follow a structured response methodology: Preparation, Identification, Containment (short-term and long-term), Eradication, Recovery, and Lessons Learned. Define containment strategies for different incident types (e.g. network isolation for ransomware, credential reset for account compromise). Coordinate response across IT, security, legal, communications, and HR. Preserve forensic evidence before remediation. Communicate with affected stakeholders in accordance with your communications plan.",caf:"D1.b",ct:"Corrective",sd:"Defence"},
{id:"A.5.27",isoDesc:"Knowledge gained from information security incidents should be used to strengthen and improve the information security controls.",name:"Learning from information security incidents",cat:"Organizational",nistFunc:"RESPOND",nistCat:"RS.MA",nistSub:"RS.MA-05, RS.AN-07, RC.RP-06",soc2:"CC7.5",cis:"CIS 17",pci:"Req 12",ce:"N/A",n80053:"IR, CP",nis2:"Art.21(b), Art.21(f)",iso22301:"Cl.10",iso27017:"§16",notes:"Conduct a formal post-incident review (PIR) within two weeks of incident closure. Use a blameless approach focusing on systemic improvements rather than individual fault. Document root cause analysis, timeline of events, what worked well, what needs improvement, and specific action items with owners and deadlines. Track remediation to completion. Share anonymised lessons across the organisation. Update playbooks, detection rules, and controls based on findings.",caf:"D2.a, D2.b",ct:"Preventive",sd:"Defence"},
{id:"A.5.28",isoDesc:"The organization should establish and implement procedures for the identification, collection, acquisition and preservation of evidence related to information security events.",name:"Collection of evidence",cat:"Organizational",nistFunc:"RESPOND",nistCat:"RS.MA",nistSub:"RS.MA-04, RS.AN-06",soc2:"CC7.4",cis:"CIS 17",pci:"Req 12",ce:"N/A",n80053:"AU, IR",nis2:"Art.21(b)",iso22301:"Cl.8.4",iso27017:"§16",notes:"Establish forensic readiness procedures including evidence preservation protocols, chain of custody documentation, and approved forensic tools. Train incident responders in evidence handling. Enable sufficient logging and retention to support investigations. Engage specialist forensic providers on retainer for complex incidents. Ensure evidence collection methods are legally admissible. Document all forensic activities with timestamps and investigator details.",caf:"D2.a",ct:"Detective",sd:"Defence"},
{id:"A.5.29",isoDesc:"The organization should plan how to maintain information security at an appropriate level during disruption.",name:"Information security during disruption",cat:"Organizational",nistFunc:"RECOVER",nistCat:"RC.RP",nistSub:"RC.RP-01, RC.CO-03, RC.CO-04",soc2:"A1.2, CC9.1",cis:"CIS 11, CIS 17",pci:"Req 9",ce:"N/A",n80053:"CP",nis2:"Art.21(c)",iso22301:"Cl.8.3, Cl.8.4",iso27017:"§17",notes:"Integrate information security requirements into business continuity plans (BCP) and disaster recovery (DR) plans. Ensure security controls remain effective during disruption — avoid reducing security posture for operational convenience. Address scenarios where primary security infrastructure is unavailable. Include cybersecurity incidents (e.g. ransomware) in BCP scenarios. Test failover security controls during DR exercises. Document alternative security procedures for degraded operations.",caf:"B5.a, D1.c",ct:"Preventive",sd:"Resilience"},
{id:"A.5.30",isoDesc:"ICT readiness should be planned, implemented, maintained and tested based on business continuity objectives and ICT continuity requirements.",name:"ICT readiness for business continuity",cat:"Organizational",nistFunc:"RECOVER",nistCat:"RC.RP",nistSub:"RC.RP-02, RC.RP-03, RC.RP-05",soc2:"A1.2, A1.3",cis:"CIS 11",pci:"Req 9",ce:"N/A",n80053:"CP",nis2:"Art.21(c)",iso22301:"Cl.8.5, Cl.8.6",iso27017:"§17, CLD.17.1.1",notes:"Define Recovery Time Objectives (RTO) and Recovery Point Objectives (RPO) for all critical systems based on business impact analysis. Implement DR solutions that meet these targets: hot standby for critical systems, warm standby for important systems, and cold backups for others. Test recovery procedures at least annually with realistic scenarios. Document recovery runbooks with step-by-step instructions. Verify data integrity after restoration. Maintain off-site and offline backup copies to protect against ransomware.",caf:"B5.a, D1.c",ct:"Preventive",sd:"Resilience"},
{id:"A.5.31",isoDesc:"Legal, statutory, regulatory and contractual requirements relevant to information security and the organization's approach to meet these requirements should be identified, documented and kept up to date.",name:"Legal, statutory, regulatory and contractual requirements",cat:"Organizational",nistFunc:"GOVERN",nistCat:"GV.OC",nistSub:"GV.OC-02, GV.OC-03",soc2:"CC2.2, CC2.3",cis:"CIS 1",pci:"Req 12",ce:"N/A",n80053:"CA, PM",nis2:"Art.21(a)",iso22301:"Cl.9",iso27017:"§18",notes:"Maintain a register of all applicable legal, statutory, regulatory, and contractual requirements covering data protection (GDPR, DPA 2018), sector regulations (FCA, NHS DSPT), cyber regulations (NIS2), payment standards (PCI DSS), and contractual obligations. Assign owners for each requirement. Monitor for regulatory changes and assess impact. Map requirements to specific security controls to demonstrate compliance. Review the register at least annually and after significant regulatory changes.",caf:"A1.a",ct:"Preventive",sd:"Governance and Ecosystem"},
{id:"A.5.32",isoDesc:"The organization should implement appropriate procedures to protect intellectual property rights.",name:"Intellectual property rights",cat:"Organizational",nistFunc:"GOVERN",nistCat:"GV.OC",nistSub:"GV.OC-03",soc2:"CC2.2",cis:"CIS 2",pci:"Req 12",ce:"N/A",n80053:"SA",nis2:"N/A",iso22301:"N/A",iso27017:"§18",notes:"Maintain a software licence register covering all commercial, open-source, and SaaS licences. Implement software asset management (SAM) tools to track licence usage and compliance. Include IP clauses in employment contracts covering ownership of work product. Define procedures for using open-source software including licence compatibility checks. Train developers on IP obligations. Conduct periodic licence compliance audits.",caf:"A1.a",ct:"Preventive",sd:"Governance and Ecosystem"},
{id:"A.5.33",isoDesc:"Records should be protected from loss, destruction, falsification, unauthorized access and unauthorized release.",name:"Protection of records",cat:"Organizational",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-01, PR.DS-02",soc2:"CC6.1, P6.7",cis:"CIS 3",pci:"Req 3",ce:"N/A",n80053:"AU",nis2:"Art.21(a)",iso22301:"Cl.7",iso27017:"§18",notes:"Define retention schedules for all record types based on legal requirements, regulatory obligations, and business needs. Implement automated retention and deletion policies in document management systems, email, and databases. Protect records from unauthorised modification or deletion using write-once storage, access controls, and integrity checking. Ensure records are recoverable within required timeframes. Document secure destruction procedures including certificates of destruction for physical media.",caf:"B3.c",ct:"Preventive",sd:"Governance and Ecosystem"},
{id:"A.5.34",isoDesc:"The organization should identify and meet the requirements regarding the preservation of privacy and protection of PII according to applicable laws and regulations and contractual requirements.",name:"Privacy and protection of PII",cat:"Organizational",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-01",soc2:"P1.1, P2.1, P3.1, P3.2, P4.1, P4.2, P4.3, P5.1, P5.2, P6.1, P6.3, P6.4, P6.5, P6.6, P7.1, P8.1, CC6.1",cis:"CIS 3",pci:"Req 3",ce:"N/A",n80053:"PT, AC",nis2:"Art.21(a)",iso22301:"N/A",iso27017:"§18",notes:"Conduct Data Protection Impact Assessments (DPIAs) for high-risk processing activities. Implement privacy by design and by default in all systems processing personal data. Maintain Records of Processing Activities (ROPA). Implement data subject rights procedures (access, erasure, portability, objection). Deploy data discovery and classification tools to locate PII across systems. Minimise data collection and retention. Encrypt PII at rest and in transit. Appoint a Data Protection Officer where required.",caf:"B3.a, B3.c",ct:"Preventive",sd:"Governance and Ecosystem"},
{id:"A.5.35",isoDesc:"The organization's approach to managing information security and its implementation including people, processes and technologies should be reviewed independently at planned intervals, or when significant changes occur.",name:"Independent review of information security",cat:"Organizational",nistFunc:"GOVERN",nistCat:"GV.OV",nistSub:"GV.OV-01, GV.OV-02",soc2:"CC4.1",cis:"CIS 18",pci:"Req 12",ce:"N/A",n80053:"CA",nis2:"Art.21(f)",iso22301:"Cl.9",iso27017:"§18",notes:"Commission independent reviews of the ISMS at planned intervals: internal audits at least annually covering all domains, external certification audits per the ISO 27001 cycle, and penetration testing at least annually or after significant changes. Ensure auditors are independent from the areas being reviewed. Track audit findings to closure with evidence of remediation. Report audit results to senior management and the board. Use audit findings to drive continuous improvement.",caf:"A2.c",ct:"Preventive",sd:"Governance and Ecosystem"},
{id:"A.5.36",isoDesc:"Compliance with the organization's information security policy, topic-specific policies, rules and standards should be regularly reviewed.",name:"Compliance with policies, rules and standards",cat:"Organizational",nistFunc:"GOVERN",nistCat:"GV.OV",nistSub:"GV.OV-03",soc2:"CC4.2",cis:"CIS 18",pci:"Req 12",ce:"N/A",n80053:"CA, PM",nis2:"Art.21(f)",iso22301:"Cl.9",iso27017:"§18",notes:"Implement a compliance monitoring programme with regular self-assessments against all applicable frameworks and standards. Use automated compliance scanning tools for technical controls (e.g. CIS benchmarks, cloud configuration). Maintain a compliance dashboard showing status across all frameworks. Conduct gap assessments when new requirements emerge. Track non-conformities with root cause analysis and corrective action plans. Report compliance status to senior management quarterly.",caf:"B1.b",ct:"Detective, Corrective",sd:"Governance and Ecosystem"},
{id:"A.5.37",isoDesc:"Operating procedures for information processing facilities should be documented and made available to personnel who need them.",name:"Documented operating procedures",cat:"Organizational",nistFunc:"PROTECT",nistCat:"PR.PS",nistSub:"PR.PS-01",soc2:"CC7.1",cis:"CIS 4",pci:"Req 12",ce:"N/A",n80053:"CM, SA",nis2:"Art.21(a)",iso22301:"Cl.7",iso27017:"§12, CLD.12.1.5",notes:"Develop Standard Operating Procedures (SOPs) for all security-critical processes: user provisioning/deprovisioning, backup and restore, patch management, incident response, change management, vulnerability scanning, and log review. Include step-by-step instructions, responsible roles, escalation procedures, and expected outcomes. Version control all procedures and review at least annually. Ensure SOPs are accessible to all relevant staff. Test procedures through regular drills.",caf:"B1.a",ct:"Preventive",sd:"Protection"},
{id:"A.6.1",isoDesc:"Background verification checks on all candidates to become personnel should be carried out prior to joining the organization and on an ongoing basis taking into consideration applicable laws, regulations and ethics and proportional to the business requirements, the classification of the information to be accessed and the perceived risks.",name:"Screening",cat:"People",nistFunc:"GOVERN",nistCat:"GV.RR",nistSub:"GV.RR-02",soc2:"CC1.4",cis:"CIS 14",pci:"Req 12",ce:"N/A",n80053:"PS",nis2:"Art.21(i)",iso22301:"Cl.7",iso27017:"§7",notes:"Screen all candidates before employment using identity verification, criminal records checks (DBS), reference checks, qualification verification, and credit checks where appropriate for the role. Apply enhanced screening (e.g. BS 7858) for roles with access to sensitive data or critical systems. Re-screen personnel when they move to higher-trust roles. Extend screening requirements to contractors and temporary staff through contractual agreements with agencies.",caf:"B6.b",ct:"Preventive",sd:"Governance and Ecosystem"},
{id:"A.6.2",isoDesc:"The employment contractual agreements should state the personnel's and the organization's responsibilities for information security.",name:"Terms and conditions of employment",cat:"People",nistFunc:"GOVERN",nistCat:"GV.RR",nistSub:"GV.RR-02",soc2:"CC1.4",cis:"CIS 14",pci:"Req 12",ce:"N/A",n80053:"PS",nis2:"Art.21(i)",iso22301:"Cl.7",iso27017:"§7",notes:"Include information security responsibilities in employment contracts and job descriptions. Require staff to sign acceptable use policies, non-disclosure agreements, and data protection acknowledgements. Clearly state consequences of security policy violations. Cover obligations that continue after employment ends (e.g. confidentiality, return of assets, data handling). Review terms when roles change significantly. Ensure contractor agreements include equivalent security obligations.",caf:"B6.a",ct:"Preventive",sd:"Governance and Ecosystem"},
{id:"A.6.3",isoDesc:"Personnel of the organization and relevant interested parties should receive appropriate information security awareness, education and training and regular updates of the organization's information security policy, topic-specific policies and procedures, as relevant for their job function.",name:"Information security awareness, education and training",cat:"People",nistFunc:"PROTECT",nistCat:"PR.AT",nistSub:"PR.AT-01, PR.AT-02",soc2:"CC1.4, CC2.2",cis:"CIS 14",pci:"Req 12",ce:"N/A",n80053:"AT",nis2:"Art.21(g)",iso22301:"Cl.7",iso27017:"§7",notes:"Deliver a multi-layered security awareness programme: mandatory induction training for new starters, annual refresher training for all staff, role-based training for privileged users and developers, and continuous reinforcement through simulated phishing campaigns, newsletters, and security champions. Measure effectiveness through completion rates, phishing simulation results, and security incident trends. Tailor content to current threats and recent incidents. Require completion as a condition of continued system access.",caf:"B6.a, B6.b",ct:"Preventive",sd:"Protection"},
{id:"A.6.4",isoDesc:"A disciplinary process should be formalized and communicated to take action against personnel and other relevant interested parties who have committed an information security policy violation.",name:"Disciplinary process",cat:"People",nistFunc:"GOVERN",nistCat:"GV.RR",nistSub:"GV.RR-02",soc2:"CC1.5",cis:"CIS 14",pci:"Req 12",ce:"N/A",n80053:"PS, AT",nis2:"Art.21(g)",iso22301:"Cl.7",iso27017:"§7",notes:"Define a clear, documented disciplinary process for security policy violations, graduated from informal warnings to formal action depending on severity and intent. Ensure the process is fair, consistent, and aligned with employment law. Involve HR and legal in serious cases. Communicate the existence of the process to all staff as a deterrent. Document all disciplinary actions and outcomes. Use incidents as learning opportunities where appropriate.",caf:"B6.a",ct:"Corrective",sd:"Governance and Ecosystem"},
{id:"A.6.5",isoDesc:"Information security responsibilities and duties that remain valid after termination or change of employment should be defined, enforced and communicated to relevant personnel and other interested parties.",name:"Responsibilities after termination or change",cat:"People",nistFunc:"PROTECT",nistCat:"PR.AA",nistSub:"PR.AA-06",soc2:"CC6.5",cis:"CIS 5",pci:"Req 8",ce:"Access Control",n80053:"PS",nis2:"Art.21(i)",iso22301:"Cl.7",iso27017:"§7",notes:"Define post-employment/engagement obligations in contracts including ongoing confidentiality, non-compete clauses where applicable, return of all information and assets, and secure deletion of company data from personal devices. Conduct exit interviews covering security obligations. Ensure all access is revoked on or before the last day. Monitor for data exfiltration during the notice period for high-risk departures. Maintain records of offboarding completion.",caf:"B2.d",ct:"Preventive",sd:"Protection"},
{id:"A.6.6",isoDesc:"Confidentiality or non-disclosure agreements reflecting the organization's needs for the protection of information should be identified, documented, regularly reviewed and signed by personnel and other relevant interested parties.",name:"Confidentiality or non-disclosure agreements",cat:"People",nistFunc:"GOVERN",nistCat:"GV.SC",nistSub:"GV.SC-05",soc2:"CC9.2",cis:"CIS 14",pci:"Req 12",ce:"N/A",n80053:"PS",nis2:"Art.21(i)",iso22301:"Cl.7",iso27017:"§7",notes:"Require NDAs or confidentiality clauses for all staff, contractors, consultants, and third parties with access to confidential information. Tailor NDA scope to the specific information and duration of engagement. Review and refresh NDAs when roles change or when access to new categories of information is granted. Ensure NDAs are legally enforceable in relevant jurisdictions. Maintain a register of signed NDAs with expiry dates.",caf:"A4.a, B6.a",ct:"Preventive",sd:"Governance and Ecosystem"},
{id:"A.6.7",isoDesc:"Security measures should be implemented when personnel are working remotely to protect information accessed, processed or stored outside the organization's premises.",name:"Remote working",cat:"People",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-01, PR.DS-02",soc2:"CC6.1, CC6.6",cis:"CIS 12",pci:"Req 12",ce:"Secure Config",n80053:"AC, PE",nis2:"Art.21(i)",iso22301:"N/A",iso27017:"§6",notes:"Establish a remote working security policy covering: mandatory VPN for corporate network access, endpoint protection requirements (EDR, disk encryption, up-to-date patching), secure Wi-Fi requirements (WPA3, no public Wi-Fi for sensitive work), physical security of devices and documents, approved collaboration tools, and clear desk/clear screen at home. Provide equipment that meets security standards. Conduct periodic remote security assessments. Address the risks of co-working spaces and public transport.",caf:"B4.b",ct:"Preventive",sd:"Protection"},
{id:"A.6.8",isoDesc:"The organization should provide a mechanism for personnel to report observed or suspected information security events through appropriate channels in a timely manner.",name:"Information security event reporting",cat:"People",nistFunc:"DETECT",nistCat:"DE.AE",nistSub:"DE.AE-02",soc2:"CC7.2, CC7.3",cis:"CIS 17",pci:"Req 12",ce:"N/A",n80053:"IR, PM",nis2:"Art.21(b)",iso22301:"Cl.8.4",iso27017:"§16",notes:"Establish clear, accessible channels for reporting security events: dedicated email address, internal ticketing system, phone hotline, and anonymous reporting option. Ensure all staff know how to recognise and report potential security events. Set expectations for response times. Protect reporters from retaliation. Acknowledge reports promptly and provide feedback on outcomes. Track reporting metrics as an indicator of security culture maturity.",caf:"C1.c, D1.a",ct:"Detective",sd:"Defence"},
{id:"A.7.1",isoDesc:"Security perimeters should be defined and used to protect areas that contain information and other associated assets.",name:"Physical security perimeters",cat:"Physical",nistFunc:"PROTECT",nistCat:"PR.AA",nistSub:"PR.AA-06",soc2:"CC6.4",cis:"CIS 1",pci:"Req 9",ce:"N/A",n80053:"PE",nis2:"Art.21(i)",iso22301:"Cl.8",iso27017:"§11",notes:"Define physical security zones based on sensitivity: public areas, staff-only areas, restricted areas (server rooms, data centres), and high-security areas (safes, secure rooms). Implement appropriate controls at each perimeter: reception desks, access card readers, biometric scanners, mantraps, and anti-tailgating measures. Monitor perimeter access points with CCTV. Conduct regular physical security assessments. Ensure perimeter controls are resilient to common bypass techniques.",caf:"B4.a",ct:"Preventive",sd:"Protection"},
{id:"A.7.2",isoDesc:"Secure areas should be protected by appropriate entry controls and access points.",name:"Physical entry",cat:"Physical",nistFunc:"PROTECT",nistCat:"PR.AA",nistSub:"PR.AA-06",soc2:"CC6.4",cis:"CIS 1",pci:"Req 9",ce:"N/A",n80053:"PE",nis2:"Art.21(i)",iso22301:"Cl.8",iso27017:"§11",notes:"Implement multi-factor physical access control for restricted areas: access card plus PIN or biometric. Maintain visitor management procedures: pre-registration, ID verification, badge issuance, escort requirements, and sign-out. Log all physical access with timestamps and retain logs for at least 90 days. Conduct regular reviews of physical access rights. Immediately revoke access for terminated personnel. Test access controls regularly to identify tailgating or bypass risks.",caf:"B2.a",ct:"Preventive",sd:"Protection"},
{id:"A.7.3",isoDesc:"Physical security for offices, rooms and facilities should be designed and implemented.",name:"Securing offices, rooms and facilities",cat:"Physical",nistFunc:"PROTECT",nistCat:"PR.AA",nistSub:"PR.AA-06",soc2:"CC6.4",cis:"CIS 1",pci:"Req 9",ce:"N/A",n80053:"PE",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§11",notes:"Secure server rooms, network closets, and sensitive areas with reinforced walls, security-rated doors, and monitored locks. Ensure offices containing sensitive equipment or documents are locked when unoccupied. Implement clean desk policy enforcement. Restrict knowledge of sensitive area locations to need-to-know personnel. Install intruder alarms with 24/7 monitoring. Conduct regular physical security walkthroughs.",caf:"B4.a",ct:"Preventive",sd:"Protection"},
{id:"A.7.4",isoDesc:"Premises should be continuously monitored for unauthorized physical access.",name:"Physical security monitoring",cat:"Physical",nistFunc:"DETECT",nistCat:"DE.CM",nistSub:"DE.CM-02",soc2:"CC6.4, CC7.2",cis:"CIS 1",pci:"Req 9",ce:"N/A",n80053:"PE",nis2:"Art.21(i)",iso22301:"Cl.8",iso27017:"§11",notes:"Deploy CCTV coverage at all entry/exit points, perimeters, server rooms, and other sensitive areas. Ensure cameras provide sufficient resolution for identification. Implement 24/7 monitoring or AI-based alerting for out-of-hours activity. Retain CCTV footage for a minimum of 30 days. Protect camera systems from tampering and unauthorised access. Complement CCTV with intruder detection systems and security patrols. Ensure compliance with GDPR and surveillance camera codes of practice.",caf:"C1.a",ct:"Detective",sd:"Protection"},
{id:"A.7.5",isoDesc:"Protection against physical and environmental threats, such as natural disasters and other intentional or unintentional physical threats to infrastructure should be designed and implemented.",name:"Protecting against physical and environmental threats",cat:"Physical",nistFunc:"PROTECT",nistCat:"PR.IR",nistSub:"PR.IR-03",soc2:"A1.2",cis:"CIS 11",pci:"Req 9",ce:"N/A",n80053:"PE",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§11",notes:"Implement environmental controls appropriate to the risk: fire detection and suppression (FM-200, inert gas for server rooms), flood detection and drainage, temperature and humidity monitoring, earthquake protection where applicable, and protection against electromagnetic interference. Maintain environmental monitoring with automated alerting. Test fire suppression and detection systems at least annually. Ensure insurance coverage reflects environmental risks.",caf:"B5.a",ct:"Preventive",sd:"Protection"},
{id:"A.7.6",isoDesc:"Security measures for working in secure areas should be designed and implemented.",name:"Working in secure areas",cat:"Physical",nistFunc:"PROTECT",nistCat:"PR.AA",nistSub:"PR.AA-06",soc2:"CC6.4",cis:"CIS 1",pci:"Req 9",ce:"N/A",n80053:"PE",nis2:"Art.21(i)",iso22301:"Cl.8",iso27017:"§11",notes:"Restrict activities in secure areas: no photography, no personal mobile devices, supervised access for visitors and contractors, requirement to display ID at all times, and prohibition of unaccompanied work outside business hours. Maintain access logs for secure areas. Limit knowledge of secure area locations and contents. Conduct regular sweeps for unauthorised devices. Brief all personnel on secure area rules before granting access.",caf:"B4.b",ct:"Preventive",sd:"Protection"},
{id:"A.7.7",isoDesc:"Clear desk rules for papers and removable storage media and clear screen rules for information processing facilities should be defined and appropriately enforced.",name:"Clear desk and clear screen",cat:"Physical",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-01",soc2:"CC6.1",cis:"CIS 3",pci:"Req 9",ce:"N/A",n80053:"PE",nis2:"Art.21(i)",iso22301:"N/A",iso27017:"§11",notes:"Enforce clear desk and clear screen as mandatory policy: lock screens after 5 minutes of inactivity (enforced via GPO/MDM), secure sensitive documents in locked drawers/cabinets when not in use, use privacy screens on devices in shared or public areas, shred rather than bin paper documents, and clear whiteboards after meetings. Conduct regular compliance checks with spot audits. Include clear desk/screen in security awareness training.",caf:"B3.c",ct:"Preventive",sd:"Protection"},
{id:"A.7.8",isoDesc:"Equipment should be sited securely and protected.",name:"Equipment siting and protection",cat:"Physical",nistFunc:"PROTECT",nistCat:"PR.IR",nistSub:"PR.IR-03",soc2:"A1.2",cis:"CIS 1",pci:"Req 9",ce:"N/A",n80053:"PE",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§11",notes:"Position critical equipment (servers, networking, UPS) in secure, access-controlled rooms with appropriate environmental controls. Protect cable runs from damage and unauthorised access. Ensure adequate cooling, power, and ventilation. Position monitors away from windows to prevent visual eavesdropping. Secure portable equipment with cable locks when unattended. Implement environmental monitoring with automated alerts for temperature, humidity, and water ingress.",caf:"B4.b",ct:"Preventive",sd:"Protection"},
{id:"A.7.9",isoDesc:"Information and other associated assets off-premises should be protected.",name:"Security of assets off-premises",cat:"Physical",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-01",soc2:"CC6.6",cis:"CIS 1, CIS 12",pci:"Req 9",ce:"N/A",n80053:"PE, MP",nis2:"Art.21(e)",iso22301:"N/A",iso27017:"§11",notes:"Define security requirements for equipment used outside company premises: mandatory full-disk encryption, VPN for all corporate access, remote wipe capability, physical security awareness (never leave unattended in vehicles or public places). Prohibit storage of Confidential/Restricted data on removable media without encryption. Require incident reporting within 4 hours of loss or theft. Include off-premises security in staff awareness training.",caf:"B3.d",ct:"Preventive",sd:"Protection"},
{id:"A.7.10",isoDesc:"Storage media should be managed through their life cycle of acquisition, use, transportation and disposal in accordance with the organization's classification scheme and handling requirements.",name:"Storage media",cat:"Physical",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-01, PR.DS-02",soc2:"CC6.1, CC6.5, C1.2",cis:"CIS 3",pci:"Req 3, Req 9",ce:"N/A",n80053:"MP",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§10",notes:"Classify storage media (USB drives, external HDDs, tapes, optical media) according to the sensitivity of data stored. Encrypt all media containing Confidential or Restricted data using AES-256 or equivalent. Maintain a register of removable media with assigned owners. Implement port control to restrict unauthorised USB device usage. Define secure transportation procedures for media in transit. Conduct certified destruction (NIST 800-88) for media at end of life with certificates of destruction.",caf:"B3.e",ct:"Preventive",sd:"Protection"},
{id:"A.7.11",isoDesc:"Information processing facilities should be protected from power failures and other disruptions caused by failures in supporting utilities.",name:"Supporting utilities",cat:"Physical",nistFunc:"PROTECT",nistCat:"PR.IR",nistSub:"PR.IR-03",soc2:"A1.2",cis:"CIS 11",pci:"Req 9",ce:"N/A",n80053:"PE",nis2:"Art.21(e)",iso22301:"Cl.8.5",iso27017:"§11",notes:"Provide redundant power supplies for critical infrastructure: dual utility feeds where possible, UPS systems sized for at least 15-30 minutes runtime, diesel generators with automatic failover and fuel for 48+ hours. Monitor UPS battery health and replace on schedule. Implement redundant cooling systems. Test failover to backup power quarterly. Ensure supporting utilities (water, telecoms) have appropriate resilience. Document all utility dependencies and single points of failure.",caf:"B5.a",ct:"Preventive",sd:"Protection"},
{id:"A.7.12",isoDesc:"Cables carrying power, data or supporting information services should be protected from interception, interference or damage.",name:"Cabling security",cat:"Physical",nistFunc:"PROTECT",nistCat:"PR.IR",nistSub:"PR.IR-03",soc2:"A1.2",cis:"CIS 1",pci:"Req 9",ce:"N/A",n80053:"PE",nis2:"Art.21(e)",iso22301:"Cl.8.5",iso27017:"§11",notes:"Route data cabling through secure conduits, avoiding public areas where possible. Use fibre optic cables for sensitive links to prevent electromagnetic eavesdropping. Separate power and data cabling to prevent interference. Label and document all cabling. Secure patch panels and distribution frames in locked cabinets. Implement network access control (802.1X) to prevent unauthorised device connection. Regularly audit cable infrastructure for unauthorised connections.",caf:"B4.a",ct:"Preventive",sd:"Protection"},
{id:"A.7.13",isoDesc:"Equipment should be maintained correctly to ensure availability, integrity and confidentiality of information.",name:"Equipment maintenance",cat:"Physical",nistFunc:"PROTECT",nistCat:"PR.PS",nistSub:"PR.PS-01, PR.PS-03",soc2:"A1.1",cis:"CIS 1",pci:"Req 9",ce:"N/A",n80053:"MP",nis2:"Art.21(e)",iso22301:"N/A",iso27017:"§10",notes:"Establish a preventive maintenance schedule for all critical equipment aligned with manufacturer recommendations. Restrict maintenance to authorised personnel — verify identity and authorisation before granting access. Supervise third-party maintenance engineers in sensitive areas. Maintain maintenance logs with details of work performed. Verify equipment integrity after maintenance. Address security implications of maintenance — ensure sensitive data is protected when equipment is serviced off-site.",caf:"B4.c",ct:"Preventive",sd:"Protection"},
{id:"A.7.14",isoDesc:"Items of equipment containing storage media should be verified to ensure that any sensitive data and licensed software has been removed or securely overwritten prior to disposal or re-use.",name:"Secure disposal or re-use of equipment",cat:"Physical",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-01",soc2:"CC6.5",cis:"CIS 3",pci:"Req 3, Req 9",ce:"N/A",n80053:"MP",nis2:"Art.21(e)",iso22301:"N/A",iso27017:"§10",notes:"Follow NIST SP 800-88 guidelines for media sanitisation: Clear (logical overwrite), Purge (cryptographic erase or degauss), or Destroy (shred, incinerate, disintegrate) based on data sensitivity. Verify sanitisation before releasing equipment for reuse or disposal. Obtain certificates of destruction from contracted disposal providers. Maintain an auditable trail from asset register to destruction certificate. Consider environmental regulations for electronic waste disposal.",caf:"B3.e",ct:"Preventive",sd:"Protection"},
{id:"A.8.1",isoDesc:"Information stored on, processed by or routed via user endpoint devices should be protected.",name:"User endpoint devices",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-01",soc2:"CC6.1, CC6.8",cis:"CIS 4, CIS 10",pci:"Req 5",ce:"Malware Protection",n80053:"CM, SI",nis2:"Art.21(e)",iso22301:"Cl.8.2",iso27017:"§12",notes:"Deploy a comprehensive endpoint protection stack: endpoint detection and response (EDR/XDR), full-disk encryption (BitLocker/FileVault), mobile device management (MDM) for configuration enforcement, automated patching, application whitelisting for high-security environments, and host-based firewall. Enforce security baselines using CIS Benchmarks. Implement network access control to quarantine non-compliant devices. Monitor endpoint health continuously and remediate non-compliance within defined SLAs.",caf:"B2.b",ct:"Preventive",sd:"Protection"},
{id:"A.8.2",isoDesc:"The allocation and use of privileged access rights should be restricted and managed.",name:"Privileged access rights",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.AA",nistSub:"PR.AA-05",soc2:"CC6.1, CC6.3",cis:"CIS 5, CIS 6",pci:"Req 7, Req 8",ce:"Access Control",n80053:"SA",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§14",notes:"Implement a Privileged Access Management (PAM) solution covering: vaulting of privileged credentials, session recording and monitoring, just-in-time access provisioning, automatic credential rotation, and break-glass procedures for emergencies. Enforce MFA for all privileged access. Separate privileged and standard user accounts. Conduct quarterly reviews of privileged access. Monitor for anomalous privileged account behaviour. Minimise the number of standing privileged accounts.",caf:"B2.c",ct:"Preventive",sd:"Protection"},
{id:"A.8.3",isoDesc:"Access to information and other associated assets should be restricted in accordance with the established topic-specific policy on access control.",name:"Information access restriction",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.AA",nistSub:"PR.AA-03, PR.AA-05",soc2:"CC6.1, CC6.3",cis:"CIS 5, CIS 6",pci:"Req 7",ce:"Access Control",n80053:"SA",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§14",notes:"Implement role-based access control (RBAC) as the foundation, supplemented by attribute-based access control (ABAC) for context-sensitive decisions (location, device, time). Enforce access restrictions at application, database, and file system levels. Implement row-level and column-level security for sensitive database fields. Use API gateways to enforce access policies for service-to-service communication. Log all access to sensitive data. Deny by default — require explicit authorisation for all access.",caf:"B2.d",ct:"Preventive",sd:"Protection"},
{id:"A.8.4",isoDesc:"Read and write access to source code, development tools and software libraries should be appropriately managed.",name:"Access to source code",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.AA",nistSub:"PR.AA-05",soc2:"CC6.1",cis:"CIS 6, CIS 16",pci:"Req 6",ce:"N/A",n80053:"SA",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§14",notes:"Store all source code in managed repositories (GitHub, GitLab, Bitbucket) with access restricted to authorised developers. Enforce branch protection rules: require pull request reviews, prevent force pushes to main/production branches, and require CI/CD pipeline passes before merge. Implement code signing for production deployments. Scan repositories for secrets and credentials using automated tools. Restrict access to production deployment pipelines. Audit repository access quarterly.",caf:"B2.d, A4.b",ct:"Preventive",sd:"Protection"},
{id:"A.8.5",isoDesc:"Secure authentication technologies and procedures should be implemented based on information access restrictions and the topic-specific policy on access control.",name:"Secure authentication",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.AA",nistSub:"PR.AA-02, PR.AA-03",soc2:"CC6.1",cis:"CIS 5, CIS 6",pci:"Req 8",ce:"Access Control",n80053:"CM",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§12, CLD.12.1.5",notes:"Implement multi-factor authentication (MFA) for all users, prioritising phishing-resistant methods (FIDO2/WebAuthn, hardware security keys) for privileged users and externally-facing systems. Deploy SSO to centralise authentication and reduce password fatigue. Implement adaptive/risk-based authentication that increases assurance for unusual access patterns. Support passwordless authentication where possible. Monitor for credential stuffing and brute force attacks. Enforce account lockout after failed attempts.",caf:"B2.a",ct:"Preventive",sd:"Protection"},
{id:"A.8.6",isoDesc:"The use of resources should be monitored and adjusted in line with current and projected capacity requirements.",name:"Capacity management",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.IR",nistSub:"PR.IR-02, PR.IR-04",soc2:"A1.1",cis:"CIS 8",pci:"Req 12",ce:"N/A",n80053:"SA, SC",nis2:"Art.21(e)",iso22301:"N/A",iso27017:"§12",notes:"Monitor capacity utilisation across compute, storage, network, and licensing dimensions. Implement auto-scaling for cloud workloads with defined upper limits to prevent cost runaway. Set alerting thresholds at 70% and 85% utilisation. Conduct capacity planning reviews quarterly, incorporating growth projections and planned changes. Address capacity-related availability risks in business continuity planning. Monitor for anomalous resource consumption that could indicate cryptomining or DDoS.",caf:"B5.b",ct:"Preventive",sd:"Resilience"},
{id:"A.8.7",isoDesc:"Protection against malware should be implemented and supported by appropriate user awareness.",name:"Protection against malware",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-01, DE.CM-04",soc2:"CC6.8",cis:"CIS 10",pci:"Req 5",ce:"Malware Protection",n80053:"SC, SI",nis2:"Art.21(e)",iso22301:"N/A",iso27017:"§12",notes:"Deploy a defence-in-depth malware protection strategy: EDR/XDR on all endpoints, email gateway filtering with attachment sandboxing, web proxy with malware scanning, network-level detection (IDS/IPS), and application whitelisting for high-security systems. Ensure signatures and engines update automatically. Configure real-time scanning plus scheduled full scans. Block execution of scripts and macros by default — whitelist by exception. Monitor for fileless malware and living-off-the-land techniques.",caf:"B4.c",ct:"Preventive, Detective, Corrective",sd:"Defence"},
{id:"A.8.8",isoDesc:"Information about technical vulnerabilities of information systems in use should be obtained, the organization's exposure to such vulnerabilities should be evaluated and appropriate measures should be taken.",name:"Management of technical vulnerabilities",cat:"Technological",nistFunc:"IDENTIFY",nistCat:"ID.RA",nistSub:"ID.RA-01",soc2:"CC7.1",cis:"CIS 7",pci:"Req 6, Req 11",ce:"Security Updates",n80053:"RA, SI",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§12",notes:"Implement a comprehensive vulnerability management programme: automated scanning at least weekly for external-facing assets and monthly for internal assets, prioritisation using CVSS plus asset criticality and exploit availability, defined remediation SLAs (Critical: 48 hours, High: 7 days, Medium: 30 days, Low: 90 days), and exception management with risk acceptance sign-off. Subscribe to vendor security advisories. Conduct annual penetration testing. Track vulnerability trends and patch compliance metrics.",caf:"B4.d",ct:"Detective",sd:"Defence"},
{id:"A.8.9",isoDesc:"Configurations, including security configurations, of hardware, software, services and networks should be established, documented, implemented, monitored and reviewed.",name:"Configuration management",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.PS",nistSub:"PR.PS-01, PR.PS-02",soc2:"CC6.1, CC7.1",cis:"CIS 4",pci:"Req 2",ce:"Secure Config",n80053:"CM",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§12",notes:"Establish security configuration baselines for all technology platforms using CIS Benchmarks or vendor hardening guides. Automate configuration deployment using infrastructure-as-code (Terraform, Ansible, GPO). Implement continuous configuration monitoring using CSPM (cloud) and compliance scanning tools. Detect and remediate configuration drift automatically. Disable unnecessary services, ports, and default accounts. Document and approve any deviations from baselines. Review baselines annually.",caf:"B4.b",ct:"Preventive",sd:"Protection"},
{id:"A.8.10",isoDesc:"Information stored in information systems, devices or in any other storage media should be deleted when no longer required.",name:"Information deletion",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-01",soc2:"CC6.5, C1.2",cis:"CIS 3",pci:"Req 3",ce:"N/A",n80053:"MP, SI",nis2:"Art.21(e), Art.21(h)",iso22301:"N/A",iso27017:"§10",notes:"Implement automated data retention and deletion policies based on the retention schedule. Ensure deletion is irreversible — use cryptographic erasure for encrypted data, secure overwrite for unencrypted data. Extend deletion to all copies including backups, replicas, archives, and cloud storage. Address data in SaaS applications and third-party systems. Implement user-initiated deletion for data subject erasure requests (GDPR Article 17). Maintain deletion logs as evidence of compliance.",caf:"B3.e",ct:"Preventive",sd:"Protection"},
{id:"A.8.11",isoDesc:"Data masking should be used in accordance with the organization's topic-specific policy on access control and other related topic-specific policies, and business requirements, taking into consideration applicable legislation.",name:"Data masking",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-01, PR.DS-02",soc2:"CC6.1",cis:"CIS 3",pci:"Req 3",ce:"N/A",n80053:"SC",nis2:"Art.21(h)",iso22301:"N/A",iso27017:"§10",notes:"Implement data masking and pseudonymisation for non-production environments (development, testing, training, analytics). Use irreversible masking techniques for non-production data. Deploy dynamic data masking for production databases to restrict what users can see based on their role. Implement tokenisation for payment card data (PCI DSS compliance). Ensure masked data maintains referential integrity and statistical properties for valid testing. Document masking rules and regularly verify effectiveness.",caf:"B3.c",ct:"Preventive",sd:"Protection"},
{id:"A.8.12",isoDesc:"Data leakage prevention measures should be applied to systems, networks and any other devices that process, store or transmit sensitive information.",name:"Data leakage prevention",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-01, PR.DS-02",soc2:"CC6.1, CC6.6, PI1.5",cis:"CIS 3, CIS 13",pci:"Req 3",ce:"N/A",n80053:"AU, PM",nis2:"Art.21(a)",iso22301:"N/A",iso27017:"§12, CLD.12.4.5",notes:"Deploy DLP controls across all data channels: endpoint DLP for USB/print/clipboard, email DLP for outbound sensitive data, cloud DLP for SaaS and cloud storage, and network DLP for web uploads. Define DLP policies based on data classification: monitor for Internal data, block for Confidential/Restricted data. Integrate with data classification labels. Tune policies to minimise false positives. Establish a DLP incident review process. Report DLP metrics to management monthly.",caf:"B3.b, B3.c",ct:"Detective",sd:"Defence"},
{id:"A.8.13",isoDesc:"Backup copies of information, software and systems should be maintained and regularly tested in accordance with the agreed topic-specific policy on backup.",name:"Information backup",cat:"Technological",nistFunc:"RECOVER",nistCat:"RC.RP",nistSub:"RC.RP-02, PR.DS-11, RC.RP-04",soc2:"A1.2",cis:"CIS 11",pci:"Req 9",ce:"N/A",n80053:"CP",nis2:"Art.21(c)",iso22301:"Cl.8.3, Cl.8.5",iso27017:"§12",notes:"Implement the 3-2-1-1-0 backup strategy: 3 copies of data, on 2 different media types, with 1 off-site copy, 1 offline/immutable copy (ransomware protection), and 0 errors after verification. Automate backup verification with integrity checks and test restores. Define backup schedules aligned with RPO requirements. Encrypt backups at rest and in transit. Test full system restoration at least annually. Document restore procedures with step-by-step runbooks. Monitor backup success/failure rates daily.",caf:"B5.c",ct:"Preventive",sd:"Resilience"},
{id:"A.8.14",isoDesc:"Information processing facilities should be implemented with redundancy sufficient to meet availability requirements.",name:"Redundancy of information processing facilities",cat:"Technological",nistFunc:"RECOVER",nistCat:"RC.RP",nistSub:"RC.RP-02, RC.RP-03",soc2:"A1.2",cis:"CIS 11",pci:"Req 9",ce:"N/A",n80053:"CP",nis2:"Art.21(c)",iso22301:"Cl.8.5, Cl.8.6",iso27017:"§17",notes:"Implement redundancy at all critical layers: active-active or active-passive clusters for applications, database replication (synchronous for zero data loss, asynchronous for geo-redundancy), redundant network paths with automatic failover, and multi-region deployment for cloud workloads. Eliminate single points of failure for critical services. Test failover procedures at least annually. Monitor replication lag and failover health continuously. Document recovery procedures for each redundancy mechanism.",caf:"B5.b",ct:"Preventive",sd:"Resilience"},
{id:"A.8.15",isoDesc:"Logs that record activities, exceptions, faults and other relevant events should be produced, stored, protected and analysed.",name:"Logging",cat:"Technological",nistFunc:"DETECT",nistCat:"DE.CM",nistSub:"DE.CM-01, DE.CM-09, PR.PS-04",soc2:"CC7.1, CC7.2",cis:"CIS 8",pci:"Req 10",ce:"N/A",n80053:"AU",nis2:"Art.21(b), Art.21(f)",iso22301:"Cl.8.4, Cl.9",iso27017:"§12, CLD.12.4.5",notes:"Centralise log collection in a SIEM platform ingesting logs from all critical sources: authentication systems, firewalls, IDS/IPS, EDR, cloud platforms, applications, databases, and physical access systems. Define log retention periods: minimum 12 months online, longer in archive for compliance (PCI DSS requires 12 months). Protect log integrity using write-once storage or cryptographic hashing. Ensure logs include who, what, when, where, and outcome. Synchronise time sources across all systems.",caf:"C1.a, C1.b",ct:"Preventive, Detective",sd:"Defence"},
{id:"A.8.16",isoDesc:"Networks, systems and applications should be monitored for anomalous behaviour and appropriate actions taken to evaluate potential information security incidents.",name:"Monitoring activities",cat:"Technological",nistFunc:"DETECT",nistCat:"DE.CM",nistSub:"DE.CM-01, DE.CM-06, DE.CM-03",soc2:"CC7.2",cis:"CIS 8, CIS 13",pci:"Req 10, Req 11",ce:"N/A",n80053:"SI, AU",nis2:"Art.21(b)",iso22301:"Cl.8.4",iso27017:"§12, CLD.12.4.5",notes:"Establish 24/7 security monitoring capability through an internal SOC or managed service (MSSP/MDR). Define detection use cases aligned with MITRE ATT&CK framework covering initial access, execution, persistence, privilege escalation, lateral movement, and data exfiltration. Implement automated alerting with defined response SLAs. Tune detection rules to reduce false positives. Conduct regular purple team exercises to validate detection coverage. Monitor for both external threats and insider risk indicators.",caf:"C1.a, C1.c, C2.a",ct:"Detective",sd:"Defence"},
{id:"A.8.17",isoDesc:"The clocks of information processing systems used by the organization should be synchronized to approved time sources.",name:"Clock synchronisation",cat:"Technological",nistFunc:"DETECT",nistCat:"DE.CM",nistSub:"DE.CM-01",soc2:"CC7.1",cis:"CIS 8",pci:"Req 10",ce:"N/A",n80053:"AU",nis2:"Art.21(b)",iso22301:"N/A",iso27017:"§12",notes:"Configure all systems to synchronise time from authoritative NTP sources (e.g. NIST, NPL, GPS). Implement a tiered NTP architecture with redundant stratum-1 sources. Monitor for time drift and alert when synchronisation fails. Ensure all log timestamps use a consistent timezone format (UTC recommended). Time synchronisation is critical for log correlation, forensic investigations, and compliance with audit requirements. Document the NTP architecture and monitor source integrity.",caf:"C1.a",ct:"Preventive",sd:"Protection"},
{id:"A.8.18",isoDesc:"The use of utility programs that can be capable of overriding system and application controls should be restricted and tightly controlled.",name:"Use of privileged utility programs",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.AA",nistSub:"PR.AA-05",soc2:"CC6.1",cis:"CIS 4, CIS 6",pci:"Req 7",ce:"N/A",n80053:"AC, CM",nis2:"Art.21(i)",iso22301:"N/A",iso27017:"§9",notes:"Restrict access to privileged utility programs (system tools, diagnostic utilities, registry editors, packet sniffers) to authorised administrators only. Implement application whitelisting to prevent execution of unauthorised tools. Log all usage of privileged utilities. Remove unnecessary utilities from production systems. Require management approval for installation of new administrative tools. Monitor for use of living-off-the-land binaries (LOLBins) that could indicate malicious activity.",caf:"B2.c",ct:"Preventive",sd:"Protection"},
{id:"A.8.19",isoDesc:"Procedures and measures should be implemented to securely manage software installation on operational systems.",name:"Installation of software on operational systems",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.PS",nistSub:"PR.PS-01, PR.PS-05",soc2:"CC6.1, CC6.8",cis:"CIS 2, CIS 4",pci:"Req 6",ce:"N/A",n80053:"SA, MA",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§12",notes:"Implement a formal software installation policy: only authorised software from approved sources may be installed on operational systems. Maintain an approved software catalogue. Use application whitelisting or software restriction policies on production systems. Enforce code signing requirements for deployed software. Route all production deployments through CI/CD pipelines with security gates. Prohibit installation of software directly by end users on managed devices. Audit installed software regularly.",caf:"B4.b",ct:"Preventive",sd:"Protection"},
{id:"A.8.20",isoDesc:"Networks and network devices should be secured, managed and controlled to protect information in systems and applications.",name:"Networks security",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-02, ID.AM-03, PR.IR-01",soc2:"CC6.1, CC6.6",cis:"CIS 12, CIS 13",pci:"Req 1, Req 11",ce:"Firewalls",n80053:"SC, AC",nis2:"Art.21(e)",iso22301:"Cl.8.5",iso27017:"§13, CLD.13.1.4",notes:"Implement network segmentation separating trust zones: internet-facing DMZ, internal user network, server/application tier, database tier, management network, and OT/IoT networks. Deploy next-generation firewalls with application-level inspection at zone boundaries. Implement IDS/IPS for threat detection. Monitor east-west traffic between segments, not just north-south. Conduct regular network architecture reviews. Document all firewall rules with business justification. Remove stale rules quarterly.",caf:"B4.a",ct:"Preventive",sd:"Protection"},
{id:"A.8.21",isoDesc:"Security mechanisms, service levels and management requirements of network services should be identified, implemented and monitored.",name:"Security of network services",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-02",soc2:"CC6.1, CC6.6",cis:"CIS 12, CIS 13",pci:"Req 1",ce:"Firewalls",n80053:"SA, CA",nis2:"Art.21(e)",iso22301:"Cl.8.5",iso27017:"§13",notes:"Define security requirements for all network services including SLAs for availability, incident response, and patching. Conduct security assessments of managed network service providers. Implement encrypted transport (TLS 1.2+, IPsec) for all network services. Monitor service provider compliance with security requirements. Include security provisions in network service contracts. Regularly review network service architecture for security weaknesses.",caf:"B4.a",ct:"Preventive",sd:"Protection"},
{id:"A.8.22",isoDesc:"Groups of information services, users and information systems should be segregated in the organization's networks.",name:"Segregation of networks",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-02",soc2:"CC6.6",cis:"CIS 12",pci:"Req 1",ce:"Firewalls",n80053:"SC",nis2:"Art.21(e)",iso22301:"Cl.8.5",iso27017:"§13",notes:"Implement microsegmentation to limit lateral movement: VLANs for broad segmentation, software-defined networking for granular control, and zero trust network access (ZTNA) for user-to-application connectivity. Isolate high-value assets (payment systems, databases with PII) in dedicated segments. Restrict inter-segment traffic to explicitly permitted flows. Monitor for unauthorised lateral movement using network detection and response (NDR) tools. Test segmentation effectiveness through penetration testing.",caf:"B5.b",ct:"Preventive",sd:"Protection"},
{id:"A.8.23",isoDesc:"Access to external websites should be managed to reduce exposure to malicious content.",name:"Web filtering",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-02",soc2:"CC6.6, CC6.8",cis:"CIS 9",pci:"Req 1",ce:"N/A",n80053:"SC, CM",nis2:"Art.21(e)",iso22301:"N/A",iso27017:"§13",notes:"Deploy web filtering to block access to known malicious sites, command-and-control infrastructure, and policy-violating content categories. Implement DNS filtering as an additional layer (e.g. Cisco Umbrella, Cloudflare Gateway). Enforce HTTPS inspection for visibility into encrypted traffic (with appropriate privacy safeguards). Block downloads of high-risk file types. Maintain URL categorisation exceptions with business justification. Monitor web filtering logs for indicators of compromise.",caf:"B4.c",ct:"Preventive",sd:"Protection"},
{id:"A.8.24",isoDesc:"Rules for the effective and acceptable use of cryptography, including cryptographic key management, should be defined and implemented.",name:"Use of cryptography",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-01, PR.DS-02, PR.DS-10",soc2:"CC6.1, CC6.7",cis:"CIS 3",pci:"Req 3, Req 4",ce:"N/A",n80053:"SC",nis2:"Art.21(h)",iso22301:"N/A",iso27017:"§10",notes:"Define a cryptographic policy specifying approved algorithms (AES-256 for symmetric, RSA-2048+ or ECC for asymmetric, SHA-256+ for hashing), key management procedures, and certificate lifecycle management. Encrypt all data at rest (full-disk, database, file-level as appropriate) and in transit (TLS 1.2+ minimum). Implement a hardware security module (HSM) or cloud KMS for key protection. Automate certificate management to prevent expiry. Plan for post-quantum cryptography migration.",caf:"B3.b, B3.c",ct:"Preventive",sd:"Protection"},
{id:"A.8.25",isoDesc:"Rules for the secure development of software and systems should be established and applied.",name:"Secure development life cycle",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.PS",nistSub:"PR.PS-06",soc2:"CC8.1",cis:"CIS 16",pci:"Req 6",ce:"N/A",n80053:"SA",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§14",notes:"Integrate security into every phase of the SDLC: threat modelling in design, secure coding standards in development (OWASP guidelines), static analysis (SAST) in build, dynamic testing (DAST) in staging, and penetration testing before production release. Implement security champions within development teams. Track security debt alongside technical debt. Require security review sign-off for all production releases. Provide regular secure development training for all developers.",caf:"A4.b",ct:"Preventive",sd:"Protection"},
{id:"A.8.26",isoDesc:"Information security requirements should be identified, specified and approved when developing or acquiring applications.",name:"Application security requirements",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.PS",nistSub:"PR.PS-06",soc2:"CC8.1",cis:"CIS 16",pci:"Req 6",ce:"N/A",n80053:"SA",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§14",notes:"Define application security requirements based on data sensitivity and exposure: input validation, output encoding, authentication and session management, access control, error handling, cryptographic controls, and API security. Incorporate OWASP Top 10 and ASVS (Application Security Verification Standard) as baseline requirements. Conduct threat modelling for all new applications and major changes. Require security acceptance criteria in user stories. Test security requirements as part of QA.",caf:"A4.b, B4.a",ct:"Preventive",sd:"Protection"},
{id:"A.8.27",isoDesc:"Principles for engineering secure systems should be established, documented, maintained and applied to any information system development activities.",name:"Secure system architecture and engineering principles",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.PS",nistSub:"PR.PS-01, PR.PS-06",soc2:"CC8.1",cis:"CIS 4, CIS 16",pci:"Req 2, Req 6",ce:"Secure Config",n80053:"SA",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§14",notes:"Apply defence-in-depth and zero trust principles in system architecture: never trust, always verify; assume breach; least privilege access; microsegmentation; and end-to-end encryption. Document security architecture patterns and reference architectures. Review all new system designs against security architecture principles. Implement security architecture review as a gate in the project lifecycle. Maintain an enterprise security architecture diagram. Regularly assess architecture against emerging threats.",caf:"B4.a",ct:"Preventive",sd:"Protection"},
{id:"A.8.28",isoDesc:"Secure coding principles should be applied to software development.",name:"Secure coding",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.PS",nistSub:"PR.PS-06",soc2:"CC8.1, PI1.2, PI1.3",cis:"CIS 16",pci:"Req 6",ce:"N/A",n80053:"SA",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§14",notes:"Enforce secure coding standards based on OWASP guidelines: input validation and output encoding to prevent injection attacks, parameterised queries for database access, secure session management, proper error handling (no sensitive data in error messages), secure file upload handling, and protection against CSRF/SSRF. Implement automated SAST tools in CI/CD pipelines. Conduct peer code reviews with security focus. Provide developers with secure coding training annually.",caf:"A4.b",ct:"Preventive",sd:"Protection"},
{id:"A.8.29",isoDesc:"Security testing processes should be defined and implemented in the development life cycle.",name:"Security testing in development and acceptance",cat:"Technological",nistFunc:"IDENTIFY",nistCat:"ID.RA",nistSub:"ID.RA-01, ID.IM-02",soc2:"CC8.1, PI1.4",cis:"CIS 16",pci:"Req 6, Req 11",ce:"N/A",n80053:"SA, CA",nis2:"Art.21(e), Art.21(f)",iso22301:"Cl.8.6, Cl.9",iso27017:"§14",notes:"Implement a multi-layered security testing approach: SAST in CI/CD pipelines (every build), DAST in staging environments (every release), interactive application security testing (IAST) in QA, dependency scanning for vulnerable libraries (continuous), penetration testing for major releases and annually, and bug bounty programmes for externally-facing applications. Define security testing pass/fail criteria. Track and remediate findings before production deployment. Verify fixes through re-testing.",caf:"A4.b, B4.d",ct:"Preventive, Detective",sd:"Protection"},
{id:"A.8.30",isoDesc:"The organization should direct, monitor and review the activities related to outsourced system development.",name:"Outsourced development",cat:"Technological",nistFunc:"GOVERN",nistCat:"GV.SC",nistSub:"GV.SC-05, GV.SC-07",soc2:"CC9.2",cis:"CIS 15, CIS 16",pci:"Req 6",ce:"N/A",n80053:"SA, CM",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§12",notes:"Include comprehensive security requirements in outsourced development contracts: adherence to secure coding standards, security testing requirements, code review processes, intellectual property ownership, source code escrow, vulnerability management obligations, and right to conduct security assessments. Require developers to undergo security training. Review third-party code before integration. Implement software composition analysis to identify vulnerable dependencies in third-party code.",caf:"A4.a, A4.b",ct:"Preventive",sd:"Protection"},
{id:"A.8.31",isoDesc:"Development, testing and production environments should be separated and secured.",name:"Separation of dev, test and production environments",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-01",soc2:"CC6.1, CC8.1",cis:"CIS 4, CIS 16",pci:"Req 6",ce:"N/A",n80053:"CM, SA",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§12, §14",notes:"Maintain strictly separated environments for development, testing/staging, and production. Prohibit use of production data in non-production environments — use masked or synthetic data instead. Implement separate credentials and access controls for each environment. Restrict production access to authorised operations staff only. Use infrastructure-as-code to ensure environment parity while maintaining isolation. Monitor for configuration drift between environments. Audit cross-environment access regularly.",caf:"B5.b",ct:"Preventive",sd:"Protection"},
{id:"A.8.32",isoDesc:"Changes to information processing facilities and information systems should be subject to change management procedures.",name:"Change management",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.PS",nistSub:"PR.PS-01, ID.RA-07",soc2:"CC8.1",cis:"CIS 4",pci:"Req 6",ce:"N/A",n80053:"CM, SA",nis2:"Art.21(e)",iso22301:"Cl.8",iso27017:"§12",notes:"Implement a formal change management process: RFC submission with business justification and security impact assessment, risk categorisation (standard, normal, emergency), CAB review for normal and significant changes, testing and rollback plan documentation, deployment window scheduling, post-implementation verification, and documentation update. Track all changes in a change management system. Audit emergency changes retrospectively. Monitor for unauthorised changes through configuration monitoring.",caf:"B1.a, B4.b",ct:"Preventive",sd:"Protection"},
{id:"A.8.33",isoDesc:"Test information should be appropriately selected, protected and managed.",name:"Test information",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-01",soc2:"CC6.1",cis:"CIS 3, CIS 16",pci:"Req 6",ce:"N/A",n80053:"SA, CA",nis2:"Art.21(e)",iso22301:"Cl.8.6, Cl.9",iso27017:"§14",notes:"Prohibit the use of production data in test environments. Generate realistic test data using data masking, synthetic data generation, or pseudonymisation tools. Ensure test data maintains referential integrity and edge cases for valid testing. Apply the same classification and protection controls to test data as to the source data if masking is not applied. Securely destroy test data after use. Document test data handling procedures. Audit compliance with test data policies.",caf:"B3.a",ct:"Preventive",sd:"Protection"},
{id:"A.8.34",isoDesc:"Audit tests and other assurance activities involving assessment of operational systems should be planned and agreed between the tester and appropriate management.",name:"Protection of info systems during audit testing",cat:"Technological",nistFunc:"PROTECT",nistCat:"PR.DS",nistSub:"PR.DS-01",soc2:"CC4.1",cis:"CIS 18",pci:"Req 12",ce:"N/A",n80053:"CA, RA",nis2:"Art.21(f)",iso22301:"Cl.9",iso27017:"§18",notes:"Plan audit testing activities to minimise disruption to production systems and business operations. Schedule intensive testing (e.g. penetration tests, performance tests) during maintenance windows or low-activity periods. Restrict auditor access to the minimum required — use read-only access where possible. Monitor auditor activities during testing. Ensure audit tools are approved and do not introduce vulnerabilities. Obtain sign-off from system owners before audit testing. Back up systems before destructive testing.",caf:"A2.c",ct:"Preventive, Detective, Corrective",sd:"Defence"}
]);

/* Build description lookup for ISO 27001 controls so ISO appears as a regular
   cross-mapped framework in non-ISO views (folder-tab badge with ref + control name
   + statement, like NIST CSF / SOC 2 / etc.). Each entry: id -> "Name — full statement". */
var ISO_DESC=(function(){var d={};CONTROLS.forEach(function(c){d[c.id]=c.name+" — "+c.isoDesc});return d;})();

var FRAMEWORKS=[
  {id:"ISO 27001",prop:"id",color:"#00d4aa",desc:ISO_DESC},
  {id:"NIST CSF 2.0",prop:"nistSub",color:"#F59E0B",desc:NIST_DESC,hier:NIST_HIER},
  {id:"SOC 2",prop:"soc2",color:"#EF4444",desc:SOC2_DESC,hier:SOC2_HIER},
  {id:"CIS v8",prop:"cis",color:"#10B981",desc:CIS_DESC,hier:CIS_HIER},
  {id:"PCI DSS",prop:"pci",color:"#F59E0B",desc:PCI_DESC,hier:PCI_HIER},
  {id:"Cyber Essentials",prop:"ce",color:"#06B6D4",desc:CE_DESC,hier:CE_HIER},
  {id:"NIST 800-53",prop:"n80053",color:"#8B5CF6",desc:N80053_DESC,hier:N80053_HIER},
  {id:"NIS 2",prop:"nis2",color:"#EC4899",desc:NIS2_DESC,hier:NIS2_HIER},
  {id:"ISO 22301",prop:"iso22301",color:"#14B8A6",desc:ISO22301_DESC,hier:ISO22301_HIER},
  {id:"ISO 27017",prop:"iso27017",color:"#6366F1",desc:ISO27017_DESC,hier:ISO27017_HIER},
  {id:"NCSC CAF",prop:"caf",color:"#1E40AF",desc:CAF_DESC,hier:CAF}
];

/* EvidencePanel — per-item evidence checklist + per-type ref input + free-form notes.
   Renders a curated "typical evidence to collect" list for the item, with a checkbox
   and a slim ref/link/path input next to each. Below: a free-form notes textarea.
   Stores user input through callbacks bound at the App level. */
function EvidencePanel(p){
  var types = p.types || [];
  if(types.length===0) return null;
  var record = p.record || {};
  var collected = record.collected || {};
  var refs = record.refs || {};
  var notes = record.notes || "";
  var done = types.filter(function(t){return collected[t]}).length;
  var pct = types.length>0 ? Math.round((done/types.length)*100) : 0;
  return e("div",{style:{marginTop:18,padding:"18px 20px",background:"var(--surface-2)",border:"1px solid var(--border)",borderRadius:10}},
    e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:14,flexWrap:"wrap"}},
      e("div",{style:{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}},
        e("span",{className:"label-up",style:{color:"var(--ink)"}},"Typical evidence to collect"),
        e("span",{style:{fontSize:11.5,color:"var(--ink-3)"}},"checklist of artefacts an assessor would expect to see")
      ),
      e("span",{className:"badge "+(done===types.length?"b-success":done>0?"b-warning":"b-neutral")},
        e("span",{className:"badge-dot",style:{background:done===types.length?"var(--success)":done>0?"var(--warning)":"var(--ink-4)"}}),
        done+" / "+types.length+" collected · "+pct+"%"
      )
    ),
    e("div",{style:{display:"flex",flexDirection:"column",gap:10}},
      types.map(function(t,ix){
        var checked = !!collected[t];
        var ref = refs[t] || "";
        var inputId = "ev-"+(p.itemId||"x")+"-"+ix;
        return e("div",{key:t,style:{display:"grid",gridTemplateColumns:"22px 1fr",gap:10,alignItems:"start",padding:"8px 10px",background:checked?"var(--success-50)":"var(--surface)",border:"1px solid "+(checked?"var(--success-100)":"var(--border)"),borderRadius:8}},
          e("input",{type:"checkbox",id:inputId,checked:checked,onChange:function(ev){p.onCheckChange(p.itemId,t,ev.target.checked)},onClick:function(ev){ev.stopPropagation()},style:{marginTop:3,width:16,height:16,accentColor:"var(--success)",cursor:"pointer"}}),
          e("div",{style:{minWidth:0}},
            e("label",{htmlFor:inputId,onClick:function(ev){ev.stopPropagation()},style:{display:"block",fontSize:13,color:"var(--ink)",lineHeight:1.5,cursor:"pointer",fontWeight:checked?500:400}},t),
            e("input",{type:"text",value:ref,placeholder:"Link, file path, ticket ID, or short note (optional)",onChange:function(ev){p.onRefChange(p.itemId,t,ev.target.value)},onClick:function(ev){ev.stopPropagation()},style:{marginTop:6,width:"100%",padding:"6px 10px",border:"1px solid var(--border)",background:"var(--surface)",color:"var(--ink-2)",fontSize:12.5,borderRadius:6,fontFamily:"inherit"}})

        scores:fwScores,onScoreChange:setFwScore,
        isoScores:isoScores,onIsoScoreChange:setIsoScore,
        evidence:fwEvidence,onEvidenceCheck:onEvidenceCheck,onEvidenceRef:onEvidenceRef,onEvidenceNotes:onEvidenceNotes});

      grp.sections.forEach(function(s){

          ),
          e("span",{style:{fontSize:11.5,color:"var(--ink-3)",flexShrink:0}},secAnchors+" item"+(secAnchors===1?"":"s"))
        ));
        if(byId[sec.id])els.push(makeCard(byId[sec.id],sec.id,sec.name,sec.desc,sec.achieved,sec.evidence));
        (sec.items||[]).forEach(function(it){
          if(!byId[it.id])return;

        });
      });
    } else if(hasItems){
      /* 2-level: group is section header, items are leaves */

      if(byId[grp.id])grpAnchors2+=1;

      });
    } else {
      /* 1-level: group itself is the leaf */
      if(!byId[grp.id])return;
      els.push(makeCard(byId[grp.id],grp.id,grp.name,grp.desc,grp.achieved,grp.evidence));
    }
  });
  return els;
}


function ProgressBar(p){
  /* Implementation readiness is computed independently per framework. Each framework
     stores its own scores under its own namespace (scores["ISO 27001"], scores["NCSC CAF"], etc.).
     p.items: the currently-displayed list of framework items (filteredIsos for ISO view,
              derivedList for non-ISO view).
     p.scores: the flat {itemId -> status} map for the active framework only. */
  var t=p.items.length; if(t===0) return null;
  var s=p.scores||{};

  function calcGroup(items){
    var impl=items.filter(function(it){return s[it.id]==="implemented"}).length;
    var prog=items.filter(function(it){return s[it.id]==="progress"}).length;
    var na=items.filter(function(it){return s[it.id]==="not_applicable"}).length;
    var eff=items.length-na; // effective denominator excludes NA
    return {impl:impl,prog:prog,na:na,void:eff-impl-prog,tot:items.length,eff:eff,
            pct:eff===0?0:Math.round(((impl+prog*0.5)/eff)*100),
            implPct:eff===0?0:(impl/eff)*100,
            progPct:eff===0?0:(prog/eff)*100};
  }

  var unit = p.primaryFw==="ISO 27001" ? "control"
           : p.primaryFw==="NCSC CAF" ? "outcome"
           : p.primaryFw==="NIST CSF 2.0" ? "subcategory"
           : p.primaryFw==="SOC 2" ? "criterion"
           : p.primaryFw==="CIS v8" ? "control"
           : p.primaryFw==="PCI DSS" ? "requirement"
           : "item";
  var unitPlural = unit==="criterion" ? "criteria" : unit+"s";

  /* ISO 27001: split Clauses 4-10 (Management System) vs Annex A */
  if(p.primaryFw==="ISO 27001"){
    var clauseItems=p.items.filter(function(c){return c.cat==="Management System"});
    var annexItems=p.items.filter(function(c){return c.cat!=="Management System"});
    var overall=calcGroup(p.items);
    var clauses=calcGroup(clauseItems);
    var annex=calcGroup(annexItems);

    function MiniBar(g,label,color){
      return e("div",{style:{flex:1,minWidth:220}},
        e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6,gap:8}},
          e("div",{style:{display:"flex",alignItems:"center",gap:6}},
            e("span",{style:{width:8,height:8,borderRadius:2,background:color,display:"inline-block",flexShrink:0}}),
            e("span",{style:{fontSize:12,fontWeight:700,color:"var(--ink-2)",letterSpacing:"-0.01em"}},label)
          ),
          e("div",{style:{display:"flex",alignItems:"baseline",gap:6}},
            e("span",{style:{fontSize:18,fontWeight:700,color:"var(--ink)",letterSpacing:"-0.02em",fontVariantNumeric:"tabular-nums",lineHeight:1}},g.pct+"%"),
            e("span",{style:{fontSize:11,color:"var(--ink-4)"}}," "+g.impl+"/"+g.tot)
          )
        ),
        e("div",{className:"progress-track",style:{height:6}},
          e("div",{className:"progress-fill",style:{width:g.implPct+"%",background:"var(--success)"}}),
          e("div",{className:"progress-fill",style:{width:g.progPct+"%",background:"var(--warning)"}})
        ),
        e("div",{style:{display:"flex",gap:10,marginTop:5,flexWrap:"wrap"}},
          e("span",{style:{fontSize:10,color:"var(--success-text)",fontWeight:600}},g.impl+" implemented"),
          e("span",{style:{fontSize:10,color:"var(--warning-text)",fontWeight:600}},g.prog+" in progress"),
          e("span",{style:{fontSize:10,color:"var(--ink-4)"}},g.void+" not started"),
          g.na>0&&e("span",{style:{fontSize:10,color:"var(--ink-3)",fontStyle:"italic"}},g.na+" not applicable")
        )
      );
    }

    return e("div",{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"20px 24px",marginBottom:20,boxShadow:"var(--shadow-sm)"}},
      e("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:16,flexWrap:"wrap"}},
        e("span",{className:"label-up"},"Implementation readiness"),
        e("span",{className:"badge b-brand"},e("span",{className:"badge-dot",style:{background:"var(--brand)"}}),p.primaryFw),
        e("span",{style:{fontSize:11,color:"var(--ink-4)",marginLeft:4}},"Overall: "+overall.pct+"% · "+overall.impl+" of "+overall.eff+" applicable controls implemented"+(overall.na>0?" ("+overall.na+" excluded in SoA)":""))
      ),
      e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}},
        MiniBar(clauses,"Clauses 4–10  (mandatory requirements)","#00d4aa"),
        MiniBar(annex,"Annex A  (operational controls)","#3B82F6")
      )
    );
  }

  /* All other frameworks: single bar */
  var g=calcGroup(p.items);
  return e("div",{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"20px 24px",marginBottom:20,boxShadow:"var(--shadow-sm)"}},
    e("div",{style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:24,marginBottom:14,flexWrap:"wrap"}},
      e("div",{},
        e("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}},
          e("span",{className:"label-up"},"Implementation readiness"),
          e("span",{className:"badge b-brand"},e("span",{className:"badge-dot",style:{background:"var(--brand)"}}),p.primaryFw)
        ),
        e("div",{style:{display:"flex",alignItems:"baseline",gap:10,flexWrap:"wrap"}},
          e("span",{style:{fontSize:32,fontWeight:700,color:"var(--ink)",letterSpacing:"-0.02em",lineHeight:1,fontVariantNumeric:"tabular-nums"}},g.pct+"%"),
          e("span",{style:{fontSize:13,color:"var(--ink-3)"}},g.impl+" of "+g.eff+" "+(g.eff===1?unit:unitPlural)+" implemented")
        ),
        e("div",{style:{fontSize:11.5,color:"var(--ink-4)",marginTop:6,fontStyle:"italic",maxWidth:560,lineHeight:1.4}},"Each framework tracks its own readiness independently. Mark items implemented in this view to advance this number.")
      ),
      e("div",{style:{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-start"}},
        e("span",{className:"badge b-success"},e("span",{className:"badge-dot",style:{background:"var(--success)"}}),g.impl+" Implemented"),
        e("span",{className:"badge b-warning"},e("span",{className:"badge-dot",style:{background:"var(--warning)"}}),g.prog+" In progress"),
        e("span",{className:"badge b-error"},e("span",{className:"badge-dot",style:{background:"var(--error)"}}),g.void+" Not started")
      )
    ),
    e("div",{className:"progress-track"},
      e("div",{className:"progress-fill",style:{width:g.implPct+"%",background:"var(--success)"}}),
      e("div",{className:"progress-fill",style:{width:g.progPct+"%",background:"var(--warning)"}})
    )
  );
}

var CROSS_FW_COLS=[
